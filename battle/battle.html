<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>星守戦線 - 戦闘</title>
<link rel="stylesheet" href="battle.css">
<style>
body { margin:0; font-family:"Consolas","Roboto Mono",monospace; background:#000; color:#e0e0e0; }
header { background:#111; padding:10px 20px; border-bottom:1px solid #444; text-align:center; }
header h1 { color:#8ae1ff; }

#battle-container { display:flex; flex-direction:column; align-items:center; padding:10px; }
#battlefield { display:flex; justify-content:space-between; width:90%; max-width:1200px; margin-top:20px; min-height:300px; position:relative; }
.party { display:flex; flex-direction:column; align-items:center; }
.character-card { width:80px; margin:5px; text-align:center; transition: all 0.3s ease; }
.character-card img { width:50px; height:50px; border-radius:50%; border:2px solid #8ae1ff; }
.status-bar { height:6px; width:60px; background:#222; margin:2px 0; border-radius:3px; overflow:hidden; }
.hp-fill { background:#ff4b4b; height:100%; width:100%; }
.sp-fill { background:#4bafff; height:100%; width:100%; }
.mp-fill { background:#8aff4b; height:100%; width:100%; }

#action-log { 
  width:90%; 
  max-width:1200px; 
  background:#111; 
  border:1px solid #444; 
  margin-top:15px; padding:10px; 
  height:120px; overflow-y:auto; 
}
.action-entry {
   margin-bottom:4px; 
}

</style>
</head>
<body>

<header>
  <h1>戦闘モード</h1>
</header>

<div id="battle-container">

<div id="battle-header">

  <div id="allies"></div>

  <div id="vs-text">
    VS
  </div>

  <div id="enemies"></div>

</div>
    <!-- 敵 -->

    <div id="action-log"></div>


  </div>

  <!-- 戦況ログ -->
  <div id="war-panel">

    <h3>戦況</h3>

    <div id="war-log">

    </div>

  </div>

</div>


<script src="enemy_master.js"></script>

<script>
alert("JS開始");

let enemiesData = [];

for(let i=0;i<4;i++){

  enemiesData.push(
    generateEnemy()
  );

}


// ======== PCステータス取得 ========
function loadNPCData(){

  const data =
    JSON.parse(
      localStorage.getItem("npcData")
      || "{}"
    );

  console.log("npcData =", data);

  return Object.entries(data).map(
    ([name, stats]) => ({

      name,

      hp: stats.hp || 100,

      sp: stats.sp || 100,

      mp: stats.mp || 100

    })
  );

}

let alliesData = loadNPCData();

alert(
  JSON.stringify(alliesData)
);

console.log(
  "味方データ",
  alliesData
);

 alert(
  JSON.stringify(alliesData)
);

console.log(

  "味方データ",

  alliesData

);

// ======== キャラクター生成 ========
function createCharacterCard(char,idPrefix){

  const div = document.createElement("div");

  div.className = "character-card";

  div.id = `${idPrefix}_${char.name}`;

div.innerHTML = `

<img src="https://placehold.co/64x64">

<div class="name">
  ${char.name}
</div>

<div class="target-icons">
</div>

<div style="font-size:10px;">
  HP : ${char.hp}
</div>

<div class="status-bar">
  <div class="hp-fill"
  style="width:${Math.min(char.hp,100)}%">
  </div>
</div>

<div style="font-size:10px;">
  SP : ${char.sp}
</div>

<div class="status-bar">
  <div class="sp-fill"
  style="width:${Math.min(char.sp,100)}%">
  </div>
</div>

<div style="font-size:10px;">
  MP : ${char.mp}
</div>

<div class="status-bar">
  <div class="mp-fill"
  style="width:${Math.min(char.mp,100)}%">
  </div>
</div>

`;

  return div;
}

const alliesContainer = document.getElementById("allies");
const enemiesContainer = document.getElementById("enemies");
console.log(
  "alliesContainer",
  alliesContainer
);

console.log(
  "enemiesContainer",
  enemiesContainer
);

function renderBattlefield() {
  
  console.log(enemiesData);
  console.log("味方数", alliesData.length);
  console.log("敵数", enemiesData.length);
  console.log(
  createCharacterCard(
    enemiesData[0],
    "enemy"
  )
);

  alert("render開始");

 alliesContainer.innerHTML = "";
 enemiesContainer.innerHTML = "";

  alert("味方初期化完了");

  if(alliesData.length === 0){

    const div =
      document.createElement("div");

    div.textContent = "参加PCなし";

    alliesContainer.appendChild(div);

  }
  
  else{

  alliesData.forEach(c=>{

    alliesContainer.appendChild(
      createCharacterCard(
        c,
        "ally"
      )
    );

  });

}

  alert("味方処理完了");

  enemiesData.forEach(c=>{

    enemiesContainer.appendChild(
      createCharacterCard(
        c,
        "enemy"
      )
    );

  });
  
  

  alert("敵処理完了");
}

// ======== アクションログ ========
const actionLog = document.getElementById("action-log");
function logAction(actor, action, target) {
  const entry = document.createElement("div");
  entry.classList.add("action-entry");
  entry.textContent = `${actor} → ${target} : ${action}`;
  actionLog.appendChild(entry);
  actionLog.scrollTop = actionLog.scrollHeight;
}

// ======== 戦闘開始 ========
renderBattlefield();

// ======== リアルタイム更新 ========
setInterval(()=>{
  alliesData = loadNPCData();

  alliesData.forEach(c=>{

    const card =
      document.getElementById(
        `ally_${c.name}`
      );

    if(card){

      card.querySelector(".hp-fill")
        .style.width = c.hp + "%";

      card.querySelector(".sp-fill")
        .style.width = c.sp + "%";

      card.querySelector(".mp-fill")
        .style.width = c.mp + "%";
    }

  });

},1000);
</script>

</body>
</html>
