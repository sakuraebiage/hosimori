<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>星守戦線戦況 - 防衛</title>

<style>
body {
  margin:0;
  font-family:"Consolas","Roboto Mono",monospace;
  background:#000;
  color:#e0e0e0;
  display:flex;
  flex-direction:column;
}

#main-container {
  display:flex;
  flex:1;
}

#map {
  position:relative;
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:600px;
}

#status-panel {
  width:280px;
  background:#111;
  border-left:1px solid #555;
  padding:10px;
  overflow-y:auto;
}

.base {
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(90,200,255,0.2);
  border:2px solid #8ae1ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:0.8em;
  cursor:pointer;
}

.hp-bar {
  width:40px;
  height:4px;
  background:#222;
  border:1px solid #444;
  position:absolute;
  bottom:-8px;
  left:7px;
}

.hp-fill {
  height:100%;
  background:#00ff9d;
}

.modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:#222;
  padding:20px;
  border:2px solid #8ae1ff;
  border-radius:8px;
  text-align:center;
}
</style>
</head>

<body>

<h1 style="text-align:center;">🛡 防衛画面</h1>

<div id="main-container">
  <div id="map"></div>
  <div id="status-panel"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>

    <button id="combatBtn">⚔ 戦闘</button>
    <button id="exploreBtn">🧭 探索</button>
    <button id="rescueBtn">🩹 救助</button>

    <br><br>
    <button id="closeBtn">閉じる</button>
  </div>
</div>

<script>

// ===== 要素 =====
const map = document.getElementById("map");
const modalBg = document.getElementById("modalBg");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

const combatBtn = document.getElementById("combatBtn");
const exploreBtn = document.getElementById("exploreBtn");
const rescueBtn = document.getElementById("rescueBtn");
const closeBtn = document.getElementById("closeBtn");

let selectedBase = null;

const bases = [];
const numBases = 20;
const radius = 250;

// ===== 拠点生成 =====
for(let i=0;i<numBases;i++){

  const base = document.createElement("div");
  base.className = "base";

  base.dataset.id = i===0 ? "本部" : `拠点${i}`;
  base.dataset.hp = 100;

  base.textContent = base.dataset.id;

  const bar = document.createElement("div");
  bar.className = "hp-bar";

  const fill = document.createElement("div");
  fill.className = "hp-fill";

  bar.appendChild(fill);
  base.appendChild(bar);

  base.onclick = ()=> {
    selectedBase = base;

    modalTitle.textContent = base.dataset.id;
    modalBody.innerHTML = `<p>${base.dataset.id}を選択しました</p>`;

    modalBg.style.display = "flex";
  };

  map.appendChild(base);
  bases.push(base);
}

// ===== 配置 =====
function positionBases(){

  const cx = map.offsetWidth / 2;
  const cy = map.offsetHeight / 2;

  bases.forEach((b,i)=>{

    if(i===0){
      b.style.left = cx - 27 + "px";
      b.style.top = cy - 27 + "px";
      return;
    }

    const angle = (i-1)/(numBases-1) * Math.PI * 2;

    b.style.left = cx + Math.cos(angle) * radius - 27 + "px";
    b.style.top = cy + Math.sin(angle) * radius - 27 + "px";
  });
}

window.onresize = positionBases;
positionBases();

// ===== モーダル =====
function closeModal(){
  modalBg.style.display = "none";
}

combatBtn.onclick = ()=> alert("戦闘へ");
exploreBtn.onclick = ()=> alert("探索へ");
rescueBtn.onclick = ()=> alert("救助へ");

closeBtn.onclick = closeModal;

modalBg.onclick = e=>{
  if(e.target === modalBg) closeModal();
};

</script>

</body>
</html>
