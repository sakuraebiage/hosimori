<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>星守戦線戦況 - 防衛</title>

<style>
body {
  margin:0;
  font-family:"Consolas","Roboto Mono",monospace;
  background:#000;
  color:#e0e0e0;
  display:flex;
  flex-direction:column;
}

#main-container {
  display:flex;
  flex:1;
}

#map {
  position:relative;
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:600px;
}

#status-panel {
  width:280px;
  background:#111;
  border-left:1px solid #555;
  padding:10px;
  overflow-y:auto;
}

.base {
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(90,200,255,0.2);
  border:2px solid #8ae1ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:0.8em;
  cursor:pointer;
}

.hp-bar {
  width:40px;
  height:4px;
  background:#222;
  border:1px solid #444;
  position:absolute;
  bottom:-8px;
  left:7px;
}

.hp-fill {
  height:100%;
  background:#00ff9d;
}

.modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:#222;
  padding:20px;
  border:2px solid #8ae1ff;
  border-radius:8px;
  text-align:center;
}
</style>
</head>

<body>

<div id="header-container"></div>

<h1 style="text-align:center;">🛡 防衛画面</h1>

<div id="main-container">
  <div id="map"></div>
  <div id="status-panel"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>

    <button id="combatBtn">⚔ 戦闘</button>
    <button id="exploreBtn">🧭 探索</button>
    <button id="rescueBtn">🩹 救助</button>

    <br><br>
    <button id="closeBtn">閉じる</button>
  </div>
</div>

<script>

/* ===== header ===== */
fetch("../common/header.html")
.then(res=>res.text())
.then(data=>{
  document.getElementById("header-container").innerHTML = data;
});

// ===== 要素 =====
const map = document.getElementById("map");
const modalBg = document.getElementById("modalBg");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

const combatBtn = document.getElementById("combatBtn");
const exploreBtn = document.getElementById("exploreBtn");
const rescueBtn = document.getElementById("rescueBtn");
const closeBtn = document.getElementById("closeBtn");

let selectedBase = null;

// ===== 拠点データ =====

const baseData = [

  { id:"本部",  x:0,    y:0 },

  { id:"拠点1", x:0,    y:-120 },

  { id:"拠点2", x:115,  y:-35 },

  { id:"拠点3", x:70,   y:95 },

  { id:"拠点4", x:-70,  y:95 },

  { id:"拠点5", x:-115, y:-35 }

];

const bases = [];

// ===== 拠点生成 =====

baseData.forEach(data=>{

  const base = document.createElement("div");

  base.className = "base";

  base.dataset.id = data.id;
  base.dataset.hp = 100;

  base.textContent = data.id;

  const bar = document.createElement("div");
  bar.className = "hp-bar";

  const fill = document.createElement("div");
  fill.className = "hp-fill";

  fill.style.width = "100%";

  bar.appendChild(fill);
  base.appendChild(bar);

  base.onclick = ()=>{

    selectedBase = base;

    modalTitle.textContent =
      base.dataset.id;

    modalBody.innerHTML =
      `<p>${base.dataset.id}を選択しました</p>`;

    modalBg.style.display = "flex";
  };

  map.appendChild(base);

  bases.push({
    element: base,
    x: data.x,
    y: data.y
  });

});

// ===== 配置 =====

function positionBases(){

  const cx = map.clientWidth / 2;
  const cy = map.clientHeight / 2;

  console.log(
    "map size:",
    map.clientWidth,
    map.clientHeight
  );

  bases.forEach(base=>{

    base.element.style.left =
      (cx + base.x - 27) + "px";

    base.element.style.top =
      (cy + base.y - 27) + "px";

  });

}

// ===== 初期配置 =====

window.addEventListener(
  "load",
  positionBases
);

window.addEventListener(
  "resize",
  positionBases
);

// ===== モーダル =====
function closeModal(){
  modalBg.style.display = "none";
}

// ===== 戦闘 =====
combatBtn.onclick = ()=>{

  if(!selectedBase){
    alert("拠点を選択してください");
    return;
  }

  localStorage.setItem(
    "selectedBase",
    selectedBase.dataset.id
  );

  window.location.href =
    "/hosimori/battle/battle.html";
};

// ===== 探索 =====
exploreBtn.onclick = ()=>{
  alert("探索画面は工事中です");
};

// ===== 救助 =====
rescueBtn.onclick = ()=>{
  alert("救助画面は工事中です");
};

closeBtn.onclick = closeModal;

modalBg.onclick = e=>{
  if(e.target === modalBg) closeModal();
};

</script>

</body>
</html>
