<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>星守戦線</title>

    <!--=====================================
    Animus Core
    ======================================-->

    <link rel="stylesheet" href="../AnimusCore/base.css">
    <link rel="stylesheet" href="../AnimusCore/theme.css">
    <link rel="stylesheet" href="../AnimusCore/animus-ui.css">
    <link rel="stylesheet" href="../AnimusCore/animation.css">

    <!--=====================================
    Home

    <link rel="stylesheet" href="css/home_v2.css">

    rel="stylesheet"

    href="css/home_mobile.css"

    media="screen and (max-width:768px)">

</head>

<body>

<!--=====================================
Background
======================================-->

<div id="backgroundArea">

    <img

        id="backgroundImage"

        src="images/backgrounds/ChatGPT Image 2026年6月28日 17_53_03.png"

        alt="背景">

</div>

<!--=====================================
Header
======================================-->

<header id="topBar">

    <h1 id="gameTitle">

        星守戦線

    </h1>

    <nav>

        <button class="animus-button">ホーム</button>
        <button class="animus-button">防衛</button>
        <button class="animus-button">探索</button>
        <button class="animus-button">戦闘</button>
        <button class="animus-button">工房</button>
        <button class="animus-button">図鑑</button>
        <button class="animus-button">チャット</button>
        <button class="animus-button">設定</button>

    </nav>

</header>

<!--=====================================
Status Bar
======================================-->

<section id="mobileTerminal">

    <div id="terminalHeader">

        <span>ANIMUS TERMINAL</span>

        <span id="terminalArrow">▶</span>

    </div>

    <div id="mobileMenu">

        <button>🏠 ホーム</button>

        <button>🛡 防衛</button>

        <button>🧭 探索</button>

        <button>⚔ 戦闘</button>

        <button>🔨 工房</button>

        <button>📖 図鑑</button>

        <button>💬 チャット</button>

        <button>⚙ 設定</button>

    </div>

</section>

<!-- ★★★★★ここ★★★★★ -->

<div id="mobileMenu">

    <button>🏠 ホーム</button>

    <button>🛡 防衛</button>

    <button>🧭 探索</button>

    <button>⚔ 戦闘</button>

    <button>🔨 工房</button>

    <button>📖 図鑑</button>

    <button>💬 チャット</button>

    <button>⚙ 設定</button>

</div>

<!-- ★★★★★ここまで★★★★★ -->

<div id="mainContainer">
<!--=====================================
Main Layout
======================================-->

<div id="mainContainer">

    <!--=====================================
    Left Panel
    ======================================-->

    <aside id="infoPanel">

        <section class="animus-card">

            <div class="animus-title">

                INFO

            </div>

            <ul>

                <li>📢 お知らせ</li>

                <li>🎉 イベント</li>

                <li>📡 Animus通信</li>

                <li>📍 現在地</li>

            </ul>

        </section>

    </aside>

        <!--=====================================
    Center Panel
    ======================================-->

    <main id="centerPanel">

        <!--=====================================
        Hero Area
        ======================================-->

        <section id="heroArea">

            <div id="welcomeArea">

                <div id="welcomeText">

                    Welcome.

                </div>

                <div id="animusLogo">

                    System of ANIMUS

                </div>

            </div>

            <!--=====================================
            Character Display
            ======================================-->

            <div id="characterArea">

                <img

                    id="characterImage"

                    src="images/character/shizumi.webp"

                    alt="立ち絵">

            </div>

        </section>

        <!--=====================================
        Character Selector
        ======================================-->

        <section id="carouselArea">

            <div id="characterList">

                <div class="characterCard active">

                    <img
                        src="images/ui/player.png"
                        alt="静海">

                    <div>

                        十束 静海

                    </div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="恵佳">

                    <div>

                        萩月 恵佳

                    </div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="瑚白">

                    <div>

                        九条 瑚白

                    </div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="宝楽">

                    <div>

                        萩月 宝楽

                    </div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="月詠">

                    <div>

                        月詠

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!--=====================================
    Right Panel
    ======================================-->

    <aside id="monitorPanel">

        <section class="animus-card">

            <div class="animus-title">

                ANIMUS MONITOR

            </div>

            <div class="monitorStatus">

                <div class="statusRow">

                    <span>接続状態</span>

                    <span class="online">

                        ● ONLINE

                    </span>

                </div>

                <div class="statusRow">

                    <span>侵食率</span>

                    <span>

                        12%

                    </span>

                </div>

                <div class="statusRow">

                    <span>ゲート反応</span>

                    <span class="safe">

                        正常

                    </span>

                </div>

                <div class="statusRow">

                    <span>世界安定度</span>

                    <span>

                        98.4%

                    </span>

                </div>

            </div>

        </section>
