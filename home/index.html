<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>星守戦線</title>

<link
rel="stylesheet"
href="css/home.css">

</head>

<body>

<!--=====================================
背景
======================================-->

<div id="backgroundArea">

    <img
        id="backgroundImage"
        src=""
        alt="背景">

    <!--
    <img
        id="characterImage"
        src="images/characters/sample.png"
        alt="立ち絵">
    -->

</div>

<!--=====================================
ヘッダー
======================================-->

<header id="topBar">

    <div id="gameTitle">

        星守戦線

    </div>

    <nav>

        <button>ホーム</button>
        <button>防衛</button>
        <button>探索</button>
        <button>戦闘</button>
        <button>工房</button>
        <button>図鑑</button>
        <button>チャット</button>
        <button>設定</button>

    </nav>

</header>
<!--=====================================
HUD
======================================-->

<div id="hud">

<div class="hudIcon">💰</div>

<div class="hudIcon">⭐</div>

<div class="hudIcon">📦</div>

<div class="hudIcon">🎁</div>

</div>

<!--=====================================
メイン
======================================-->

<div id="mainContainer">

    <!--=====================================
    左
    ======================================-->

    <aside id="leftPanel">

        <div class="glass">

            <h2>指揮官</h2>

            <img
                id="playerIcon"
                src="images/ui/player.png"
                alt="プレイヤー">

            <div>Lv.50</div>

            <div>隊員ランクⅢ</div>

            <div>EXP</div>

        </div>

    </aside>

    <!--=====================================
    中央
    ======================================-->

<main id="centerPanel">

    <div id="activeBadge">

        ACTIVE

    </div>

</main>


        <!--=====================================
        自PCカルーセル
        ======================================-->

        <section id="carouselArea">

            <div id="characterList">

                <div class="characterCard active">

                    <img
                        src="images/ui/player.png"
                        alt="静海">

                    <div>静海</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="恵佳">

                    <div>恵佳</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="瑚白">

                    <div>瑚白</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="宝楽">

                    <div>宝楽</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="月詠">

                    <div>月詠</div>

                </div>

            </div>

        </section>

    </main>

    <!--=====================================
    右
    ======================================-->

    <aside id="rightPanel">

        <div class="glass">

            <h2>戦況</h2>

            <div id="warStatus">

                ALL GREEN

            </div>

        </div>

        <div class="glass">

            <h2>救世者</h2>

            <div>👑 十束静海</div>

            <div>交戦中</div>

            <hr>

            <div>👑 萩月要</div>

            <div>執務中</div>

        </div>

        <div class="glass">

            <h2>イベント</h2>

            <div>

                🐾 くぅーん様 本部突撃まで<br>

                23:51

            </div>

        </div>

    </aside>

</div>

<!--=====================================
スクショ
======================================-->

<button id="screenShotButton">

    📷

</button>

<script src="js/home.js"></script>

</body>

</html>
