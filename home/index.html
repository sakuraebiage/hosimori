<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>星守戦線</title>

    <!--=====================================
    Animus Core
    ======================================-->

    <link rel="stylesheet" href="../AnimusCore/base.css">
    <link rel="stylesheet" href="../AnimusCore/theme.css">
    <link rel="stylesheet" href="../AnimusCore/animus-ui.css">
    <link rel="stylesheet" href="../AnimusCore/animation.css">

    <!--=====================================
    Home
    ======================================-->

    <link rel="stylesheet" href="css/home.css">

</head>

<body>

<!--=====================================
Background
ゲーム全体の背景
======================================-->

<div id="backgroundArea">

    <img

        id="backgroundImage"

        src="images/background/sample.webp"

        alt="背景">

</div>

<!--=====================================
Header
ゲーム共通ヘッダー
======================================-->

<header id="topBar">

    <h1 id="gameTitle">

        星守戦線

    </h1>

    <nav>

        <button class="animus-button">ホーム</button>

        <button class="animus-button">防衛</button>

        <button class="animus-button">探索</button>

        <button class="animus-button">戦闘</button>

        <button class="animus-button">工房</button>

        <button class="animus-button">図鑑</button>

        <button class="animus-button">チャット</button>

        <button class="animus-button">設定</button>

    </nav>

</header>

<!--=====================================
Status Bar
プレイヤー情報
======================================-->

<section id="statusBar">

    <div class="statusItem">

        💰

        <strong>

            2,450,000 Cr

        </strong>

    </div>

    <div class="statusItem">

        ⚡

        <strong>

            AP 120 /120

        </strong>

    </div>

    <div class="statusItem">

        🔥

        <strong>

            BP 5 /5

        </strong>

    </div>

    <div class="statusItem">

        ◇

        <strong>

            CP 8 /10

        </strong>

    </div>

</section>

<!--=====================================
Main Layout
======================================-->

<div id="mainContainer">

    <!--=====================================
    Information Area
    左サイド情報
    ======================================-->

    <aside id="infoPanel">

        <div class="animus-card">

            <div class="animus-title">

                INFO

            </div>

            <ul>

                <li>📢 お知らせ</li>

                <li>🎉 イベント</li>

                <li>📡 Animus通信</li>

                <li>📍 現在地</li>

            </ul>

        </div>

    </aside>

        <!--=====================================
    Hero Area
    ホーム画面中央
    ======================================-->

    <main id="centerPanel">

        <!--=============================
        Hero
        ==============================-->

        <section id="heroArea">

            <!--=========================
            Welcome
            ==========================-->

            <div id="welcomeArea">

                <div id="welcomeText">

                    Welcome.

                </div>

                <div id="animusLogo">

                    System of ANIMUS

                </div>

            </div>

            <!--=========================
            Character Display
            ==========================-->

            <div id="characterArea">

                <img

                    id="characterImage"

                    src="images/character/shizumi.webp"

                    alt="立ち絵">

            </div>

        </section>

        <!--=============================
        Character Carousel
        ==============================-->

        <section id="carouselArea">

            <div id="characterList">

                <div class="characterCard active">

                    <img
                        src="images/ui/player.png"
                        alt="静海">

                    <div>十束 静海</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="恵佳">

                    <div>萩月 恵佳</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="瑚白">

                    <div>九条 瑚白</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="宝楽">

                    <div>萩月 宝楽</div>

                </div>

                <div class="characterCard">

                    <img
                        src="images/ui/player.png"
                        alt="月詠">

                    <div>月詠</div>

                </div>

            </div>

        </section>

    </main>
