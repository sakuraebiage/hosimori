<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background:#0a0f2c;
  color:#fff;
  font-family:monospace;
  padding:20px;
}

/* 共通 */
.box{
  border:2px solid #ccc;
  padding:10px;
}

/* 上段 */
.top{
  display:flex;
  gap:20px;
}

/* ステータス */
.stats{
  display:grid;
  grid-template-columns:repeat(2,150px);
  gap:10px;
}

/* 総合 */
.total{
  flex:1;
  height:180px;
}

/* 装備 */
.equip{
  margin-top:20px;
}

/* スキル */
.skills{
  margin-top:20px;
}

.skill-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.skill-row{
  display:flex;
  gap:10px;
}

.skill-list{
  margin-top:20px;
  height:150px;
}
</style>
</head>

<body>

<h2>ステータス</h2>

<div class="top">

  <!-- ステータス -->
  <div class="stats" id="stats"></div>

  <!-- 総合 -->
  <div class="box total" id="totalStats">
    総合ステータス（装備込み）
  </div>

</div>

<!-- 装備 -->
<h2>装備</h2>
<div id="equipment" class="equip"></div>

<!-- スキル -->
<h2>スキルスロット</h2>
<div id="skills" class="skills"></div>

<!-- スキル一覧 -->
<h2>スキル一覧</h2>
<input id="search" placeholder="検索" oninput="renderSkills()">
<div id="skillList" class="box skill-list"></div>

<script>

// =====================
// ダミー
// =====================
const statsList = ["physical","magic","vitality","endurance","agility","spirit"];

let player = {
  base:{ physical:5, magic:5, vitality:5, endurance:5, agility:5, spirit:5 },
  equipment:{},
  skillsEquipped:[]
};

// =====================
// ステータス
// =====================
function renderStats(){

  const div = document.getElementById("stats");
  div.innerHTML="";

  statsList.forEach(k=>{

    div.innerHTML += `
      <div class="box">
        ${k}<br>
        <input type="number" value="${player.base[k]}">
        <div style="font-size:11px;">説明</div>
      </div>
    `;
  });

}

// =====================
// スキルスロット
// =====================
function renderSkills(){

  const div = document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<10;i++){

    div.innerHTML += `
      <div class="skill-row">
        <div class="box" style="flex:1;">スキル</div>
        <div class="box" style="flex:1;">効果</div>
      </div>
    `;
  }
}

// =====================
// 初期
// =====================
renderStats();
renderSkills();

</script>

</body>
</html>
