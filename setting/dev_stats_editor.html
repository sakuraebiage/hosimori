<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}
header{
  background:#111;
  padding:10px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}
nav a{
  margin:0 6px;
  color:#8ae1ff;
  text-decoration:none;
}
.box{
  border:1px solid #00eaff;
  padding:6px;
  margin:4px;
}
.top{
  display:flex;
  gap:20px;
}
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}
.stat-input{
  width:60px;
}
.total-box{
  width:220px;
}
.total-row{
  display:flex;
  justify-content:space-between;
}
.portrait{
  width:200px;
  margin-top:10px;
  border:1px solid #00eaff;
}
.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}
select{
  width:180px;
}
.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}
.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>

  <div>
    <div id="totalStats" class="box total-box"></div>
    <img id="portrait" class="portrait">
  </div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== スキル内蔵（🔥絶対動く） =====
const skillMaster = [
  {id:"s1",name:"星裂斬",power:1.2,cost:{sp:5,mp:0},type:"物理"},
  {id:"s2",name:"蒼流波",power:1.0,cost:{sp:0,mp:8},type:"魔法"},
  {id:"s3",name:"月影突",power:0.9,cost:{sp:3,mp:2},type:"物理"}
];

function getAllSkills(){
  return skillMaster;
}

// ===== 初期ステ =====
const baseDefault = {
  physical:10, magic:10, vitality:20,
  endurance:5, agility:5, spirit:5, luck:5
};

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  points:30,
  skillsEquipped:[],
  equipment:{weapon:"",armor:""}
};

// ===== 装備 =====
const equipmentMaster = [
  {id:"w1",name:"鉄の剣",type:"weapon",bonus:{physical:5}},
  {id:"a1",name:"革の鎧",type:"armor",bonus:{endurance:5}}
];

// ===== ステ計算 =====
function getTotalStats(){
  const t={};
  for(let k in baseDefault){
    t[k] = baseDefault[k] + (player.base[k]||0) + (player.trainingBonus[k]||0);
  }
  return t;
}

// ===== スロット =====
function getSkillSlots(){
  const t=getTotalStats();
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  return Math.max(3, Math.min(10, 3 + Math.floor(total/30)));
}

// ===== 表示 =====
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");

  div.innerHTML=`<div class="box">残ポイント：${player.points}</div>`;

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        <input class="stat-input" value="${player.base[k]}"
          onchange="player.base['${k}']=Number(this.value)||0;save();render();">
        → ${t[k]}<br>
      </div>
    `;
  }
}

// ===== 総合 =====
function renderTotal(){
  const t=getTotalStats();
  document.getElementById("totalStats").innerHTML=`
    <div class="total-row">HP <span>${t.vitality*10}</span></div>
    <div class="total-row">物理 <span>${t.physical*2}</span></div>
    <div class="total-row">魔法 <span>${t.magic*2}</span></div>
  `;
}

// ===== スキル =====
function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";

  const skills = getAllSkills();
  const slotCount = getSkillSlots();

  for(let i=0;i<slotCount;i++){
    const current=player.skillsEquipped[i];
    const skill=skills.find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;
    skills.forEach(s=>{
      options+=`<option value="${s.id}">${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">
        <select onchange="player.skillsEquipped[${i}]=this.value;save();render();">
          ${options}
        </select>

        <div class="box" style="flex:1;">
          ${skill ? skill.name : "未設定"}
        </div>
      </div>
    `;
  }
}

// ===== 一覧 =====
function renderSkillList(){
  const div=document.getElementById("skillList");
  div.innerHTML="";
  getAllSkills().forEach(s=>{
    div.innerHTML+=`<div class="skill-item">${s.name}</div>`;
  });
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderSkills();
  renderSkillList();
}

render();

</script>

</body>
</html>
