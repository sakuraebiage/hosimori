<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>
body {
  background: radial-gradient(circle at center, #0a0f2c, #000);
  color: #e0e6ff;
  font-family: "Consolas", monospace;
}

.main { display:flex; gap:20px; padding:20px; }

.left { width:260px; }
.portrait {
  width:100%;
  border-radius:12px;
  box-shadow:0 0 20px rgba(100,150,255,0.5);
}

.right {
  flex:1;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  padding:20px;
}

.title { color:#8ae1ff; margin-top:10px; }

.stat {
  background:#111;
  padding:6px;
  margin:4px;
  border-radius:6px;
}

.skill-box {
  background:#111;
  padding:6px;
  margin:4px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="main">

<div class="left">
  <img id="portrait" class="portrait">
</div>

<div class="right">

<h2 class="title">ステータス</h2>
<div id="stats"></div>

<h2 class="title">スキル設定</h2>
<div id="skills"></div>

<h2 class="title">所持スキル</h2>
<div id="skillList"></div>

<button onclick="save()" class="mt-4 px-4 py-2 bg-blue-600 rounded">
保存
</button>

</div>
</div>

<script>

// =====================
// スキルマスター
// =====================
const skillMaster = [
  {id:"s1", name:"星裂斬", effect:"物理120%", desc:"単体攻撃"},
  {id:"s2", name:"蒼流波", effect:"魔法100%", desc:"範囲攻撃"},
  {id:"s3", name:"月影突", effect:"物理90%", desc:"高速攻撃"}
];

// =====================
// プレイヤー
// =====================
let player = JSON.parse(localStorage.getItem("playerData"));

if(!player){
  player = {
    base:{
      physical:10,
      magic:8,
      vitality:12,
      endurance:10,
      agility:7,
      spirit:9,
      luck:5
    },
    skillsOwned:[],
    skillsEquipped:[],
    portrait:"https://via.placeholder.com/300x400"
  };

  save();
}

// =====================
// ステータス表示（編集可能）
// =====================
function renderStats(){
  const div = document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){

    const wrap = document.createElement("div");
    wrap.className = "stat";

    wrap.innerHTML = `
      <label>${k}</label>
      <input type="number" value="${player.base[k]}" 
        onchange="updateStat('${k}', this.value)">
    `;

    div.appendChild(wrap);
  }
}

// =====================
// ステ更新
// =====================
function updateStat(key, value){
  player.base[key] = Number(value);
  save();
}

// =====================
// スキル設定
// =====================
function renderSkills(){
  const div = document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">未設定</option>`;

    player.skillsOwned.forEach(s=>{
      sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
    });

    sel.value = player.skillsEquipped[i] || "";

    sel.onchange=(e)=>{
      player.skillsEquipped[i]=e.target.value;
      save();
    };

    div.appendChild(sel);
  }
}

// =====================
// スキル一覧
// =====================
function renderSkillList(){
  const div = document.getElementById("skillList");
  div.innerHTML="";

  if(player.skillsOwned.length===0){
    div.innerHTML="スキルなし（訓練で取得）";
    return;
  }

  player.skillsOwned.forEach(s=>{
    div.innerHTML += `<div class="skill-box">${s.name}</div>`;
  });
}

// =====================
// スキル取得
// =====================
function learnSkill(id){

  const skill = skillMaster.find(s=>s.id===id);
  if(!skill) return;

  if(player.skillsOwned.some(s=>s.id===id)) return;

  player.skillsOwned.push({...skill});
  save();
  render();
}

// =====================
// 保存
// =====================
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// =====================
// 初期描画
// =====================
function render(){
  document.getElementById("portrait").src = player.portrait;
  renderStats();
  renderSkills();
  renderSkillList();
}

render();

</script>

</body>
</html>
