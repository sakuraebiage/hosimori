<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#7df9ff;
  font-family:'Orbitron','Consolas',sans-serif;
  padding:20px;
}

/* ===== 近未来UI ===== */
.box{
  border:1px solid rgba(0,255,255,0.5);
  padding:8px;
  margin:6px;
  background:rgba(0,0,0,0.3);
  box-shadow:0 0 10px rgba(0,255,255,0.2);
  backdrop-filter: blur(4px);
}

h1,h2{
  text-shadow:0 0 8px #00f7ff;
}

/* ===== header ===== */
header{
  background:#050a1a;
  padding:12px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}

nav a{
  margin:0 10px;
  color:#7df9ff;
  text-decoration:none;
}
nav a:hover{
  text-shadow:0 0 6px #00ffff;
}

/* ===== レイアウト ===== */
.top{
  display:flex;
  gap:20px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

/* ===== ステ入力 ===== */
.stat-input{
  width:60px;
  background:#000;
  color:#00eaff;
  border:1px solid #00eaff;
}

/* ===== 総合 ===== */
.total-box{
  width:220px;
}
.total-row{
  display:flex;
  justify-content:space-between;
}

/* ===== 立ち絵 ===== */
.portrait{
  width:220px;
  border:1px solid #00eaff;
  box-shadow:0 0 10px #00eaff;
}

/* ===== スキル ===== */
.skill-row{
  display:flex;
  gap:8px;
  margin-bottom:6px;
}

select{
  width:180px;
  background:#000;
  color:#00eaff;
  border:1px solid #00eaff;
}

/* ===== セリフ ===== */
.voice-input{
  width:100%;
  font-size:11px;
  background:#000;
  color:#7df9ff;
  border:1px solid #00eaff;
}

/* ===== 一覧 ===== */
.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}
.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}

/* ===== 保存ボタン ===== */
.save-btn{
  position:fixed;
  right:20px;
  top:20px;
  background:#000;
  color:#00eaff;
  border:1px solid #00eaff;
  padding:6px 12px;
}
</style>
</head>

<body>

<button class="save-btn" onclick="save()">💾 保存</button>

<header>
<h1>星守戦線</h1>
<nav>
<a href="#">🏠</a>
<a href="#">🛡</a>
<a href="#">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">

  <div id="stats" class="stats-grid"></div>

  <div style="display:flex; gap:10px;">
    <div id="totalStats" class="box total-box"></div>
    <img id="portrait" class="portrait">
  </div>

</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",cost:{sp:5,mp:0},type:"物理"},
  {id:"s2",name:"蒼流波",cost:{sp:0,mp:8},type:"魔法"},
  {id:"s3",name:"月影突",cost:{sp:3,mp:2},type:"物理"}
];

function getAllSkills(){ return skillMaster; }

// ===== ステ説明 =====
const statDesc = {
  physical:"攻撃/SP",
  magic:"魔攻/MP",
  vitality:"HP",
  endurance:"防御",
  agility:"速度",
  spirit:"回復",
  luck:"会心"
};

// ===== 初期 =====
const baseDefault = {
  physical:10, magic:10, vitality:20,
  endurance:5, agility:5, spirit:5, luck:5
};

let player = JSON.parse(localStorage.getItem("playerData")) || {};

player.base ||= {physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0};
player.trainingBonus ||= {physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0};
player.points ??= 30;
player.skillsEquipped ||= [];
player.skillVoices ||= {};
player.equipment ||= {weapon:"",armor:""};

// ===== 計算 =====
function getTotalStats(){
  const t={};
  for(let k in baseDefault){
    t[k]=baseDefault[k]+player.base[k]+player.trainingBonus[k];
  }
  return t;
}

function getCritRate(){
  const t=getTotalStats();
  return Math.floor((t.physical+t.magic)*0.2+t.luck*0.5);
}

function getCritDamage(){
  return (1.3+getCritRate()*0.01).toFixed(2);
}

// ===== 表示 =====
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");

  div.innerHTML=`<div class="box">残:${player.points}</div>`;

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        <small>${statDesc[k]}</small><br>
        <input class="stat-input" value="${player.base[k]}"
          onchange="player.base['${k}']=Number(this.value)||0;render();">
        → ${t[k]}
      </div>
    `;
  }
}

function renderTotal(){
  const t=getTotalStats();
  document.getElementById("totalStats").innerHTML=`
    <div class="total-row">HP ${t.vitality*10}</div>
    <div class="total-row">物理 ${t.physical*2}</div>
    <div class="total-row">魔法 ${t.magic*2}</div>
    <div class="total-row">会心 ${getCritRate()}%</div>
    <div class="total-row">威力 ${getCritDamage()}倍</div>
  `;
}

// ===== スキル =====
function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";

  const skills=getAllSkills();

  for(let i=0;i<6;i++){

    const current=player.skillsEquipped[i];
    const skill=skills.find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;
    skills.forEach(s=>{
      options+=`<option value="${s.id}" ${current===s.id?"selected":""}>${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">

        <select onchange="player.skillsEquipped[${i}]=this.value;save();render();">
          ${options}
        </select>

        <div class="box" style="flex:1;">
          ${skill ? skill.name : "未設定"}

          ${
            skill
            ? `<input class="voice-input"
                placeholder="セリフ (**太字 *斜体*)"
                value="${player.skillVoices[skill.id]||""}"
                onchange="player.skillVoices['${skill.id}']=this.value;save();">`
            : ""
          }

        </div>

      </div>
    `;
  }
}

// ===== 一覧 =====
function renderSkillList(){
  const div=document.getElementById("skillList");
  div.innerHTML="";
  getAllSkills().forEach(s=>{
    div.innerHTML+=`<div class="skill-item">${s.name}</div>`;
  });
}

// ===== 立ち絵 =====
function renderPortrait(){
  const img=localStorage.getItem("profileImage");
  if(img) document.getElementById("portrait").src=img;
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData",JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderSkills();
  renderSkillList();
  renderPortrait();
}

render();

</script>

</body>
</html>
