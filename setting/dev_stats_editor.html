<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background:#020611;
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}
.box{
  border:1px solid #00eaff;
  padding:8px;
  margin:5px;
}
.top{
  display:flex;
  gap:20px;
}
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}
.skill-row{
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<h1>⚔ 戦闘設定</h1>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div id="totalStats" class="box"></div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキル</h2>
<div id="skills"></div>

<script>

// ===== 初期 =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  level:1,
  exp:0,
  admin:false,
  base:{physical:5,magic:5,vitality:5,endurance:5,agility:5,spirit:5,luck:5},
  points:10,
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  skillsEquipped:[],
  skillLock:[],
  equipment:{}
};

// ===== スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",power:1.2,cost:{sp:5,mp:0},target:"敵単体",type:"物理"},
  {id:"s2",name:"蒼流波",power:1.0,cost:{sp:0,mp:8},target:"敵全体",type:"魔法"}
];

// ===== 装備 =====
const equipmentMaster = [
  {id:"w1",name:"鉄の剣",type:"weapon",bonus:{physical:5}},
  {id:"a1",name:"革の鎧",type:"armor",bonus:{endurance:5}}
];

// ===== 合計ステ =====
function getTotalStats(){

  const t = {...player.base};

  // 訓練ボーナス
  for(let k in player.trainingBonus){
    t[k] += player.trainingBonus[k];
  }

  // 装備
  Object.values(player.equipment).forEach(id=>{
    const eq = equipmentMaster.find(e=>e.id===id);
    if(eq){
      for(let k in eq.bonus) t[k]+=eq.bonus[k];
    }
  });

  return t;
}

// ===== 会心 =====
function getMainAtk(){
  const t=getTotalStats();
  return Math.max(t.physical,t.magic);
}
function getCritRate(){
  const t=getTotalStats();
  return Math.min(80,Math.floor(getMainAtk()*0.3+t.luck*0.5));
}
function getCritDmg(){
  return (1.5+getMainAtk()*0.01+getCritRate()*0.01).toFixed(2);
}

// ===== レベルアップ =====
function addExp(val){

  player.exp += val;

  if(player.exp >= 100){
    player.exp = 0;
    player.level++;
    player.points += 5;
    alert("レベルアップ！");
  }

  save();
  render();
}

// ===== 訓練 =====
function train(stat){
  player.trainingBonus[stat] += 1;
  save(); render();
}

// ===== ステ操作 =====
function changeStat(k,val){

  val = Number(val);
  const diff = val - player.base[k];

  if(!player.admin && diff > player.points){
    alert("ポイント不足");
    render(); return;
  }

  player.base[k] = val;

  if(!player.admin){
    player.points -= diff;
  }

  save(); render();
}

function addStat(k){
  if(!player.admin && player.points<=0)return;

  player.base[k]++;
  if(!player.admin) player.points--;

  save(); render();
}

function minusStat(k){
  if(player.base[k]<=0)return;

  player.base[k]--;
  if(!player.admin) player.points++;

  save(); render();
}

// ===== リセット =====
function resetStats(){

  if(!confirm("リセットする？")) return;

  const total = Object.values(player.base).reduce((a,b)=>a+b,0);

  player.points += total;
  for(let k in player.base) player.base[k]=0;

  save(); render();
}

// ===== 表示 =====
function renderStats(){

  const t = getTotalStats();
  const div = document.getElementById("stats");

  div.innerHTML = `
    <div class="box">
      Lv:${player.level}<br>
      残ポイント:${player.points}
      <button onclick="resetStats()">リセット</button>
    </div>
  `;

  for(let k in player.base){

    div.innerHTML += `
      <div class="box">
        ${k}<br>
        <input type="number" value="${player.base[k]}"
          onchange="changeStat('${k}',this.value)">
        → ${t[k]}<br>

        <button onclick="addStat('${k}')">＋</button>
        <button onclick="minusStat('${k}')">－</button>
        <button onclick="train('${k}')">訓練</button>
      </div>
    `;
  }
}

// ===== 総合 =====
function renderTotal(){

  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML = `
    HP:${t.vitality*10}<br>
    SP:${t.physical*2}<br>
    MP:${t.spirit*5}<br><br>

    物理:${t.physical*2}<br>
    魔法:${t.magic*2}<br>
    会心:${getCritRate()}% (${getCritDmg()}倍)<br><br>

    防御:${t.endurance*2}<br>
    速度:${(t.agility*1.5).toFixed(1)}<br><br>

    回復:${Math.floor(t.spirit*1.2)}<br>
    被回復:${Math.floor(t.vitality*1.1)}<br><br>

    知識:100<br>
    幸運:${t.luck}
  `;
}

// ===== 装備 =====
function renderEquipment(){

  const div=document.getElementById("equipment");
  div.innerHTML="";

  ["weapon","armor"].forEach(type=>{

    let options="<option value=''>なし</option>";

    equipmentMaster
      .filter(e=>e.type===type)
      .forEach(e=>{
        options+=`<option value="${e.id}">${e.name}</option>`;
      });

    div.innerHTML+=`
      <div class="box">
        ${type}<br>
        <select onchange="equip('${type}',this.value)">
          ${options}
        </select>
      </div>
    `;
  });
}

function equip(type,id){
  player.equipment[type]=id;
  save();render();
}

// ===== スキル =====
function renderSkills(){

  const div=document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const current=player.skillsEquipped[i];
    const skill=skillMaster.find(s=>s.id===current);

    let options="<option>未設定</option>";
    skillMaster.forEach(s=>{
      options+=`<option value="${s.id}">${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">
        <select onchange="setSkill(${i},this.value)">
          ${options}
        </select>

        <div class="box">
          ${skill?`
            SP:${skill.cost.sp}
            対象:${skill.target}
            種別:${skill.type}
          `:"未設定"}
        </div>
      </div>
    `;
  }
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save();render();
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 描画 =====
function render(){
  renderStats();
  renderTotal();
  renderEquipment();
  renderSkills();
}

render();

</script>

</body>
</html>
