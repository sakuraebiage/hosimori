<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}

/* header */
header{
  background:#111;
  padding:10px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}
nav a{
  margin:0 6px;
  color:#8ae1ff;
  text-decoration:none;
}

/* UI */
.box{
  border:1px solid #00eaff;
  padding:6px;
  margin:4px;
}

.top{
  display:flex;
  gap:20px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

/* スキル */
.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}

select{
  width:150px;
  font-size:12px;
}

/* 一覧 */
.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}

.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
  cursor:pointer;
}

.skill-item:hover{
  background:rgba(0,255,255,0.1);
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div id="totalStats" class="box"></div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  level:1,
  base:{physical:5,magic:5,vitality:5,endurance:5,agility:5,spirit:5,luck:5},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  points:10,
  skillsEquipped:[],
  equipment:{}
};

// ===== 初期スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",power:1.2,cost:{sp:5,mp:0},target:"敵単体",type:"物理"},
  {id:"s2",name:"蒼流波",power:1.0,cost:{sp:0,mp:8},target:"敵全体",type:"魔法"}
];

// ===== スキル生成 =====
function generateSkill(seed){

  const t = getTotalStats();
  const main = t.physical > t.magic ? "物理" : "魔法";

  // 30%バフ
  if(Math.random() < 0.3){

    const stats = ["physical","magic","agility","endurance"];
    const stat = stats[Math.floor(Math.random()*stats.length)];

    return {
      id:"gen_"+seed,
      name:`自己強化・${stat}`,
      type:"バフ",
      target:"自分",
      effect:{
        stat,
        value:Math.floor(t[stat]*0.2),
        duration:3
      },
      cost:{sp:0,mp:5}
    };
  }

  return {
    id:"gen_"+seed,
    name:`${main}技${seed}`,
    power:Number((1+Math.max(t.physical,t.magic)*0.01).toFixed(2)),
    cost:{sp: main==="物理"?5:0, mp: main==="魔法"?5:0},
    target:"敵単体",
    type:main
  };
}

// ===== 生成保存 =====
function getGeneratedSkills(){

  let data = JSON.parse(localStorage.getItem("genSkills"));

  if(!data){
    data=[];
    for(let i=0;i<30;i++){
      data.push(generateSkill(i));
    }
    localStorage.setItem("genSkills",JSON.stringify(data));
  }

  return data;
}

function getAllSkills(){
  return [...skillMaster, ...getGeneratedSkills()];
}

// ===== ステ計算 =====
function getTotalStats(){
  const t={...player.base};

  for(let k in player.trainingBonus){
    t[k]+=player.trainingBonus[k];
  }

  return t;
}

function getMainAtk(){
  const t=getTotalStats();
  return Math.max(t.physical,t.magic);
}

function getCritRate(){
  const t=getTotalStats();
  return Math.min(80,Math.floor(getMainAtk()*0.3+t.luck*0.5));
}

function getCritDmg(){
  return (1.5+getMainAtk()*0.01+getCritRate()*0.01).toFixed(2);
}

// ===== ステ操作 =====
function addStat(k){
  if(player.points<=0)return;
  player.base[k]++;
  player.points--;
  save();render();
}

function train(k){
  player.trainingBonus[k]++;
  save();render();
}

// ===== 表示 =====
function renderStats(){

  const t=getTotalStats();
  const div=document.getElementById("stats");

  div.innerHTML=`残:${player.points}`;

  for(let k in player.base){

    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        ${player.base[k]} → ${t[k]}<br>
        <button onclick="addStat('${k}')">＋</button>
        <button onclick="train('${k}')">訓練</button>
      </div>
    `;
  }
}

function renderTotal(){

  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    HP:${t.vitality*10}<br>
    SP:${t.physical*2}<br>
    MP:${t.spirit*5}<br><br>

    物理:${t.physical*2}<br>
    魔法:${t.magic*2}<br>
    会心:${getCritRate()}% (${getCritDmg()}倍)
  `;
}

// ===== スキル =====
function renderSkills(){

  const div=document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const current=player.skillsEquipped[i];
    const skill=getAllSkills().find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;

    getAllSkills().forEach(s=>{
      options+=`<option value="${s.id}" ${current===s.id?"selected":""}>${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">

        <select onchange="setSkill(${i},this.value)">
          ${options}
        </select>

        <div class="box">
          ${
            skill
            ? skill.type==="バフ"
              ? `${skill.name}｜${skill.effect.stat}+${skill.effect.value}`
              : `${skill.name}｜威力:${skill.power}`
            : "未設定"
          }
        </div>

      </div>
    `;
  }
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save();render();
}

// ===== 一覧 =====
function renderSkillList(){

  const word=document.getElementById("skillSearch").value||"";
  const div=document.getElementById("skillList");

  div.innerHTML="";

  getAllSkills()
    .filter(s=>s.name.includes(word))
    .forEach(s=>{

      div.innerHTML+=`
        <div class="skill-item" onclick="addSkill('${s.id}')">

          ${s.name}
          ${
            s.type==="バフ"
            ? `｜${s.effect.stat}+${s.effect.value}`
            : `｜威力:${s.power}`
          }

        </div>
      `;
    });
}

function addSkill(id){
  player.skillsEquipped.push(id);
  save();render();
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderSkills();
  renderSkillList();
}

render();

</script>

</body>
</html>
