<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}

header{
  background:#111;
  padding:10px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}

nav a{
  margin:0 6px;
  color:#8ae1ff;
  text-decoration:none;
}

.box{
  border:1px solid #00eaff;
  padding:6px;
  margin:4px;
}

.top{
  display:flex;
  gap:20px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.stat-input{
  width:60px;
}

.total-box{
  width:220px;
}

.total-row{
  display:flex;
  justify-content:space-between;
}

.portrait{
  width:200px;
  margin-top:10px;
  border:1px solid #00eaff;
}

.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}

select{
  width:150px;
}

.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}

.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>

  <div>
    <div id="totalStats" class="box total-box"></div>
    <img id="portrait" class="portrait">
  </div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== 初期ステ =====
const baseDefault = {
  physical:5, magic:5, vitality:5,
  endurance:5, agility:5, spirit:5, luck:5
};

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  points:30,
  skillsEquipped:[],
  equipment:{weapon:"",armor:""}
};

// ===== 装備 =====
const equipmentMaster = [
  {id:"w1",name:"鉄の剣",type:"weapon",bonus:{physical:5}},
  {id:"w2",name:"魔導書",type:"weapon",bonus:{magic:5}},
  {id:"a1",name:"革の鎧",type:"armor",bonus:{endurance:5}},
  {id:"a2",name:"ローブ",type:"armor",bonus:{spirit:5}}
];

// ===== ステ計算 =====
function getTotalStats(){
  const t={};
  for(let k in baseDefault){
    t[k] = baseDefault[k] + player.base[k];
  }
  for(let k in player.trainingBonus){
    t[k]+=player.trainingBonus[k];
  }
  Object.values(player.equipment).forEach(id=>{
    const eq=equipmentMaster.find(e=>e.id===id);
    if(eq){
      for(let k in eq.bonus){
        t[k]+=eq.bonus[k];
      }
    }
  });
  return t;
}

// ===== 会心 =====
function getMainAtk(){
  const t=getTotalStats();
  return Math.max(t.physical,t.magic);
}

function getCritRate(){
  const t=getTotalStats();
  return Math.min(80, Math.floor(getMainAtk()*0.3 + t.luck*0.5));
}

function getCritDamage(){
  return (1.5 + getMainAtk()*0.01 + getCritRate()*0.01).toFixed(2);
}

// ===== スロット =====
function getSkillSlots(){
  const t=getTotalStats();
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  return Math.min(16, 5 + Math.floor(total/20));
}

// ===== 入力 =====
function setStat(k,val){
  val = Number(val)||0;
  const diff = val - player.base[k];
  if(diff > player.points){
    alert("ポイント不足");
    return;
  }
  player.base[k]=val;
  player.points -= diff;
  save(); render();
}

// ===== ＋－ =====
function addStat(k){
  if(player.points<=0)return;
  player.base[k]++; player.points--;
  save(); render();
}

function minusStat(k){
  if(player.base[k]<=0)return;
  player.base[k]--; player.points++;
  save(); render();
}

// ===== 訓練 =====
function train(k){
  player.trainingBonus[k]++;
  save(); render();
}

// ===== 表示 =====
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");

  div.innerHTML=`<div class="box">残ポイント：${player.points}</div>`;

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        <input class="stat-input" value="${player.base[k]}"
          onchange="setStat('${k}',this.value)">
        → ${t[k]}<br>
        <button onclick="addStat('${k}')">＋</button>
        <button onclick="minusStat('${k}')">－</button>
        <button onclick="train('${k}')">訓練</button>
      </div>
    `;
  }
}

// ===== 総合 =====
function renderTotal(){
  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    <div class="total-row">HP <span>${t.vitality*10}</span></div>
    <div class="total-row">SP <span>${t.physical*2}</span></div>
    <div class="total-row">MP <span>${t.spirit*5}</span></div>

    <hr>

    <div class="total-row">物理 <span>${t.physical*2}</span></div>
    <div class="total-row">魔法 <span>${t.magic*2}</span></div>

    <div class="total-row">会心率 <span>${getCritRate()}%</span></div>
    <div class="total-row">会心威力 <span>${getCritDamage()}倍</span></div>

    <div class="total-row">防御 <span>${t.endurance*2}</span></div>
    <div class="total-row">速度 <span>${(t.agility*1.5).toFixed(1)}</span></div>

    <div class="total-row">幸運 <span>${t.luck}</span></div>
  `;
}

// ===== 装備 =====
function renderEquipment(){
  const div=document.getElementById("equipment");
  div.innerHTML="";

  ["weapon","armor"].forEach(type=>{
    let options="<option value=''>なし</option>";
    equipmentMaster
      .filter(e=>e.type===type)
      .forEach(e=>{
        options+=`<option value="${e.id}" ${player.equipment[type]===e.id?"selected":""}>${e.name}</option>`;
      });

    div.innerHTML+=`
      <div class="box">
        ${type}<br>
        <select onchange="equip('${type}',this.value)">
          ${options}
        </select>
      </div>
    `;
  });
}

function equip(type,id){
  player.equipment[type]=id;
  save(); render();
}

// ===== 立ち絵 =====
function renderPortrait(){
  const img = localStorage.getItem("profileImage");
  if(img){
    document.getElementById("portrait").src = img;
  }
}

// ===== スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",cost:{sp:5,mp:0},target:"敵単体",type:"物理"},
  {id:"s2",name:"蒼流波",cost:{sp:0,mp:8},target:"敵全体",type:"魔法"},
  {id:"s3",name:"月影突",cost:{sp:3,mp:2},target:"敵単体",type:"物理"}
];

function getAllSkills(){
  return skillMaster;
}

// ===== スロット表示 =====
function renderSkills(){

  const div=document.getElementById("skills");
  div.innerHTML="";

  const slotCount = getSkillSlots();

  for(let i=0;i<slotCount;i++){

    const current=player.skillsEquipped[i];
    const skill=getAllSkills().find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;
    getAllSkills().forEach(s=>{
      options+=`<option value="${s.id}" ${current===s.id?"selected":""}>${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">
        <select onchange="setSkill(${i},this.value)">
          ${options}
        </select>
        <div class="box" style="flex:1;">
          ${skill ? `${skill.name} ｜ SP:${skill.cost.sp} MP:${skill.cost.mp}` : "未設定"}
        </div>
      </div>
    `;
  }
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save(); render();
}

// ===== 一覧 =====
function renderSkillList(){
  const word=document.getElementById("skillSearch").value||"";
  const div=document.getElementById("skillList");
  div.innerHTML="";

  getAllSkills()
    .filter(s=>s.name.includes(word))
    .forEach(s=>{
      div.innerHTML+=`
        <div class="skill-item">
          ${s.name} ｜ SP:${s.cost.sp} MP:${s.cost.mp}
        </div>
      `;
    });
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderEquipment();
  renderSkills();
  renderSkillList();
  renderPortrait();
}

render();

</script>

</body>
</html>
