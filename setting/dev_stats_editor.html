<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background:#0a0f2c;
  color:#fff;
  font-family:monospace;
  padding:20px;
}

.box{
  border:2px solid #aaa;
  padding:8px;
  margin:5px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.top{
  display:flex;
  gap:20px;
}

.skill-row{
  display:flex;
  gap:10px;
  margin-bottom:5px;
}
</style>
</head>

<body>
  
  <header style="background:#111;padding:10px;border-bottom:1px solid #444;">

  <h1 style="color:#8ae1ff;margin:0;text-align:center;">星守戦線</h1>

  <nav style="
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:6px;
  ">

    <a href="/hosimori/index.html">🏠</a>
    <a href="/hosimori/defense/defense.html">🛡</a>
    <a href="/hosimori/setting/dev_stats_editor.html" style="color:#fff;">⚔</a>
    <a href="/hosimori/traning/training.html">💪</a>
    <a href="/hosimori/craft/craft.html">⚒</a>
    <a href="/hosimori/item/item.html">🎒</a>

  </nav>

</header>

<h2>ステータス</h2>

<div class="top">

  <div id="stats" class="stats-grid"></div>

  <div id="totalStats" class="box" style="flex:1;"></div>

</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<script>

// =====================
// スキル
// =====================
const skillMaster = [
  {id:"s1", name:"星裂斬", power:1.2, target:"単体", cost:{sp:5,mp:0}, desc:"物理攻撃"},
  {id:"s2", name:"蒼流波", power:1.0, target:"全体", cost:{sp:0,mp:8}, desc:"魔法攻撃"},
  {id:"s3", name:"月影突", power:0.9, target:"単体", cost:{sp:3,mp:2}, desc:"高会心"}
];

// =====================
// 装備
// =====================
const equipmentMaster = [
  {id:"w1", name:"鉄の剣", type:"weapon", bonus:{ physical:5 }},
  {id:"a1", name:"革の鎧", type:"armor", bonus:{ endurance:5 }},
  {id:"r1", name:"幸運の指輪", type:"accessory", bonus:{ luck:5 }}
];

// =====================
// プレイヤー
// =====================
let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{ physical:5, magic:5, vitality:5, endurance:5, agility:5, spirit:5, luck:5 },
  points:10,
  skillsEquipped:[],
  equipment:{},
  skillLock:[]
};

// =====================
// ステ説明
// =====================
const statDesc = {
  physical:"物理攻撃/SP",
  magic:"魔法攻撃/MP",
  vitality:"HP",
  endurance:"防御",
  agility:"速度",
  spirit:"バフ強化",
  luck:"会心率"
};

// =====================
// 合計ステ
// =====================
function getTotalStats(){
  const t = {...player.base};

  Object.values(player.equipment).forEach(id=>{
    const eq = equipmentMaster.find(e=>e.id===id);
    if(!eq)return;
    for(let k in eq.bonus) t[k]+=eq.bonus[k];
  });

  return t;
}

// =====================
// 会心
// =====================
function getMainAtk(){
  const t = getTotalStats();
  return Math.max(t.physical, t.magic);
}

function getCritRate(){
  const t = getTotalStats();
  return Math.min(80, Math.floor(getMainAtk()*0.3 + t.luck*0.5));
}

function getCritDmg(){
  return Number((1.5 + getMainAtk()*0.01 + getCritRate()*0.01).toFixed(2));
}

// =====================
// バフ
// =====================
function getBuffPower(){
  return (1 + getTotalStats().spirit*0.02).toFixed(2);
}

// =====================
// スロット数
// =====================
function getSlotCount(){
  const t = getTotalStats();
  const sum = Object.values(t).reduce((a,b)=>a+b,0);
  return Math.min(16, 5 + Math.floor(sum/20));
}

// =====================
// 描画
// =====================
function renderStats(){

  const t = getTotalStats();
  const div = document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){
    div.innerHTML += `
      <div class="box">
        ${k}<br>
        ${player.base[k]} → ${t[k]}<br>
        <small>${statDesc[k]}</small><br>
        <button onclick="addStat('${k}')">＋</button>
      </div>
    `;
  }
}

function renderTotal(){

  const t = getTotalStats();

  document.getElementById("totalStats").innerHTML = `
    物理:${t.physical*2}<br>
    魔法:${t.magic*2}<br>
    HP:${t.vitality*10}<br>
    防御:${t.endurance*2}<br>
    速度:${t.agility*1.5}<br><br>

    会心率:${getCritRate()}%<br>
    会心威力:${getCritDmg()}倍<br><br>

    知識:100<br>
    バフ倍率:${getBuffPower()}倍
  `;
}

// =====================
// スキル
// =====================
let dragIndex=null;

function renderSkills(){

  const div = document.getElementById("skills");
  div.innerHTML="";

  const count = getSlotCount();

  for(let i=0;i<count;i++){

    const current = player.skillsEquipped[i];
    const skill = skillMaster.find(s=>s.id===current);
    const locked = player.skillLock[i];

    let options = `<option value="">未設定</option>`;
    skillMaster.forEach(s=>{
      options += `<option value="${s.id}" ${current===s.id?"selected":""}>${s.name}</option>`;
    });

    div.innerHTML += `
      <div class="skill-row"
        draggable="true"
        ondragstart="dragIndex=${i}"
        ondragover="event.preventDefault()"
        ondrop="swap(${i})"
      >

        <div class="box">
          <select onchange="setSkill(${i},this.value)" ${locked?"disabled":""}>
            ${options}
          </select>
          <button onclick="lock(${i})">${locked?"🔒":"🔓"}</button>
        </div>

        <div class="box">
          ${skill?`${skill.desc}<br>威力${skill.power}`:"未設定"}
        </div>

      </div>
    `;
  }
}

function swap(i){
  const tmp = player.skillsEquipped[i];
  player.skillsEquipped[i]=player.skillsEquipped[dragIndex];
  player.skillsEquipped[dragIndex]=tmp;
  save();render();
}

function lock(i){
  player.skillLock[i]=!player.skillLock[i];
  save();render();
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save();render();
}

// =====================
function addStat(k){
  if(player.points<=0)return;
  player.base[k]++;
  player.points--;
  save();render();
}

function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

function render(){
  renderStats();
  renderTotal();
  renderSkills();
}

render();

</script>

</body>
</html>
