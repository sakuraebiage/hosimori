<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top, #0a0f2c, #020611);
  color:#e0f7ff;
  font-family:Consolas,monospace;
  padding:20px;
}

/* ===== header ===== */
header{
  background:#111;
  padding:10px;
  border-bottom:1px solid #00eaff;
  text-align:center;
}

nav{
  margin-top:6px;
}

nav a{
  color:#8ae1ff;
  margin:0 6px;
  text-decoration:none;
}

/* ===== UI ===== */
.box{
  background:rgba(0,0,0,0.6);
  border:1px solid #00eaff;
  box-shadow:0 0 10px #00eaff;
  padding:8px;
  margin:5px;
  border-radius:6px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.top{
  display:flex;
  gap:20px;
}

.skill-row{
  display:flex;
  gap:10px;
  margin-bottom:6px;
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
<a href="/hosimori/traning/training.html">💪</a>
<a href="/hosimori/craft/craft.html">⚒</a>
<a href="/hosimori/item/item.html">🎒</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div id="totalStats" class="box" style="flex:1;"></div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<script>

// ===== 初期スキル =====
const skillMaster = [
  {id:"s1", name:"星裂斬", power:1.2, cost:{sp:5,mp:0}, desc:"物理攻撃"},
  {id:"s2", name:"蒼流波", power:1.0, cost:{sp:0,mp:8}, desc:"魔法攻撃"}
];

// ===== 初期装備 =====
const equipmentMaster = [
  {id:"w1", name:"鉄の剣", type:"weapon", bonus:{physical:5}},
  {id:"a1", name:"革の鎧", type:"armor", bonus:{endurance:5}}
];

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{physical:5,magic:5,vitality:5,endurance:5,agility:5,spirit:5,luck:5},
  points:10,
  skillsEquipped:[],
  equipment:{},
  skillLock:[]
};

// ===== カスタム =====
function getCustomSkills(){
  return JSON.parse(localStorage.getItem("customSkills")) || [];
}
function getAllSkills(){
  return [...skillMaster, ...getCustomSkills()];
}

function getCustomEquip(){
  return JSON.parse(localStorage.getItem("customEquip")) || [];
}
function getAllEquip(){
  return [...equipmentMaster, ...getCustomEquip()];
}

// ===== 計算 =====
function getTotalStats(){
  const t = {...player.base};
  Object.values(player.equipment).forEach(id=>{
    const eq = getAllEquip().find(e=>e.id===id);
    if(eq){
      for(let k in eq.bonus) t[k]+=eq.bonus[k];
    }
  });
  return t;
}

function getMainAtk(){
  const t = getTotalStats();
  return Math.max(t.physical,t.magic);
}

function getCritRate(){
  const t = getTotalStats();
  return Math.min(80, Math.floor(getMainAtk()*0.3 + t.luck*0.5));
}

function getCritDmg(){
  return (1.5 + getMainAtk()*0.01 + getCritRate()*0.01).toFixed(2);
}

function getBuffPower(){
  return (1 + getTotalStats().spirit*0.02).toFixed(2);
}

// ===== 表示 =====
function renderStats(){
  const t = getTotalStats();
  const div = document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        ${player.base[k]} → ${t[k]}<br>
        <button onclick="addStat('${k}')">＋</button>
      </div>
    `;
  }
}

function renderTotal(){
  const t = getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    HP:${t.vitality*10}<br>
    SP:${t.physical*2}<br>
    MP:${t.spirit*5}<br><br>

    物理攻撃:${t.physical*2}<br>
    魔法攻撃:${t.magic*2}<br>
    会心率:${getCritRate()}%（${getCritDmg()}倍）<br><br>

    防御:${t.endurance*2}<br>
    速度:${(t.agility*1.5).toFixed(1)}<br><br>

    回復量:${Math.floor(t.spirit*1.2)}<br>
    被回復量:${Math.floor(t.vitality*1.1)}<br><br>

    知識:100<br>
    幸運:${t.luck}<br>
    バフ倍率:${getBuffPower()}倍
  `;
}

// ===== 装備 =====
function renderEquipment(){
  const div=document.getElementById("equipment");
  div.innerHTML="";

  ["weapon","armor","accessory"].forEach(type=>{
    let options=`<option value="">なし</option>`;
    getAllEquip().filter(e=>e.type===type).forEach(e=>{
      options+=`<option value="${e.id}">${e.name}</option>`;
    });

    div.innerHTML+=`
      <div class="box">
        ${type}<br>
        <select onchange="equip('${type}',this.value)">
          ${options}
        </select>
      </div>
    `;
  });
}

function equip(type,id){
  player.equipment[type]=id;
  save();render();
}

// ===== スキル =====
let dragIndex=null;

function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<8;i++){

    const current=player.skillsEquipped[i];
    const skill=getAllSkills().find(s=>s.id===current);
    const locked=player.skillLock[i];

    let options=`<option value="">未設定</option>`;
    getAllSkills().forEach(s=>{
      options+=`<option value="${s.id}">${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row"
        draggable="true"
        ondragstart="dragIndex=${i}"
        ondragover="event.preventDefault()"
        ondrop="swap(${i})"
      >
        <div class="box">
          <select onchange="setSkill(${i},this.value)" ${locked?"disabled":""}>
            ${options}
          </select>
          <button onclick="lock(${i})">${locked?"🔒":"🔓"}</button>
        </div>

        <div class="box">
          ${skill?`${skill.desc}`:"未設定"}
        </div>
      </div>
    `;
  }
}

function swap(i){
  const tmp=player.skillsEquipped[i];
  player.skillsEquipped[i]=player.skillsEquipped[dragIndex];
  player.skillsEquipped[dragIndex]=tmp;
  save();render();
}

function lock(i){
  player.skillLock[i]=!player.skillLock[i];
  save();render();
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save();render();
}

// ===== その他 =====
function addStat(k){
  if(player.points<=0)return;
  player.base[k]++;
  player.points--;
  save();render();
}

function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

function render(){
  renderStats();
  renderTotal();
  renderEquipment();
  renderSkills();
}

render();

</script>

</body>
</html>
