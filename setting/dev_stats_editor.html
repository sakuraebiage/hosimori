<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}
.box{ border:1px solid #00eaff; padding:6px; margin:4px; }
.top{ display:flex; gap:20px; }
.stats-grid{ display:grid; grid-template-columns:1fr 1fr; }
.stat-input{ width:60px; }
.total-box{ width:260px; }
.total-row{ display:flex; justify-content:space-between; }
.total-row span{ color:#fff; font-weight:bold; }
.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
  border:1px solid rgba(0,255,255,0.3);
  padding:1px;
}
select{ width:180px; }
.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}
.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}
</style>
</head>

<body>

<div id="header"></div>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div>
    <div id="totalStats" class="box total-box"></div>
  </div>
</div>

<h2 id="slotTitle">スキルスロット</h2>
<div id="skills"></div>

<button onclick="save()" class="box">💾 保存</button>

<h2>スキル使用セリフ</h2>

<div id="skillVoices" class="box"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

/* ===== header ===== */
fetch("../common/header.html")
.then(res=>res.text())
.then(data=>{
  document.getElementById("header").innerHTML = data;
});

getEffectText()
function getEffectText(skill){

  const e = skill.effectData;
  if(!e) return "効果なし";

  switch(e.type){

    case "atkUp": return `攻撃+${e.value}%`;
    case "defUp": return `防御+${e.value}%`;
    case "spdUp": return `速度+${e.value}%`;
    case "critUp": return `会心率+${e.value}%`;

    case "heal": return "HP回復";
    case "damage": return "ダメージ";

    case "allUp": return "全能力上昇";
    case "invincible": return "ダメージ無効";
    case "extraTurn": return "追加行動";

    default: return "特殊効果";
  }
}

/* ===== 初期ステ ===== */
const baseDefault = {
  physical:10, magic:10, vitality:20,
  endurance:5, agility:5, spirit:5, luck:5
};

const statDesc = {
  physical:"物攻・物防・SP増加",
  magic:"魔攻・魔防・MP増加",
  vitality:"HP増加・被回復量UP",
  endurance:"防御力UP",
  agility:"速度・命中UP",
  spirit:"回復量・MP増加",
  luck:"会心率・ドロップ率UP"
};

let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  points:30,
  skillsEquipped:[]
};

/* ===== ステ ===== */
function getTotalStats(){
  const t={};
  for(let k in baseDefault){
    t[k]=baseDefault[k]+(player.base[k]||0)+(player.trainingBonus[k]||0);
  }
  return t;
}

function getTotalPower(){
  return Object.values(getTotalStats()).reduce((a,b)=>a+b,0);
}

/* ===== 会心 ===== */
function getMainAtk(){
  const t=getTotalStats();
  return Math.max(t.physical,t.magic);
}
function getCritRate(){
  const t=getTotalStats();
  return Math.min(80, Math.floor(getMainAtk()*0.3 + t.luck*0.5));
}
function getCritDamage(){
  const main=getMainAtk();
  const crit=getCritRate();
  return (1.3 + main*0.005 + crit*0.003).toFixed(2);
}

/* ===== スキル ===== */


/* ===== 改名 ===== */
function getSkillName(skill){
  const names=JSON.parse(localStorage.getItem("skillNames"))||{};
  return names[skill.id]||skill.name;
}

function renameSkill(id){
  const skill=getAllSkills().find(s=>s.id===id);
  if(!skill || !skill.isCustom){
    alert("改名不可");
    return;
  }
  const name=prompt("新しい名前");
  if(!name)return;

  const data=JSON.parse(localStorage.getItem("skillNames"))||{};
  data[id]=name;
  localStorage.setItem("skillNames",JSON.stringify(data));

  render();
}

/* ===== スロット ===== */
function getSkillSlots(){
  return Math.min(16,5+Math.floor(getTotalPower()/25));
}

/* ===== 描画 ===== */
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");

  div.innerHTML=`<div class="box">残ポイント：${player.points}</div>`;

  Object.keys(baseDefault).forEach(k=>{

    if(player.base[k] === undefined){
      player.base[k] = 0;
    }

    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        <small>${statDesc[k]}</small><br>

        <input class="stat-input"
        value="${player.base[k]}"
        onchange="player.base['${k}']=Number(this.value)||0;save();render();">

        → ${t[k]}
      </div>`;
  });
  
}

function renderTotal(){
  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    <div class="total-row">HP <span>${t.vitality*10}</span></div>
    <div class="total-row">SP <span>${t.physical*2}</span></div>
    <div class="total-row">MP <span>${t.spirit*5}</span></div>

    <hr>

    <div class="total-row">物理攻撃 <span>${t.physical*2}</span></div>
    <div class="total-row">魔法攻撃 <span>${t.magic*2}</span></div>
    <div class="total-row">防御 <span>${t.endurance*2}</span></div>
    <div class="total-row">速度 <span>${t.agility}</span></div>

    <hr>

    <div class="total-row">会心率 <span>${getCritRate()}%</span></div>
    <div class="total-row">会心威力 <span>${getCritDamage()}倍</span></div>

    <div class="total-row">回復量 <span>${Math.floor(t.spirit*1.2)}</span></div>
    <div class="total-row">被回復量 <span>${Math.floor(t.vitality*1.1)}</span></div>

    <div class="total-row">知識 <span>100</span></div>
    <div class="total-row">幸運 <span>${t.luck}</span></div>
  `;
}

function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";
  const skills=getAllSkills();
  const count=getSkillSlots();

  for(let i=0;i<count;i++){
    const current=player.skillsEquipped[i];
    const skill=skills.find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;
    skills.forEach((s,index)=>{
      options+=`<option value="${s.id}" ${current===s.id?"selected":""}>
        No.${index+1}｜${getSkillName(s)}
      </option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">
        <select onchange="player.skillsEquipped[${i}]=this.value;save();render();">
          ${options}
        </select>

        <div class="box" style="flex:1;">
          ${skill
          ? `No.${skills.indexOf(skill)+1}
          ｜${getSkillName(skill)}

          ${skill.category==="attack"
            ? `｜威力:${skill.power ?? 1}`
            : `｜効果:${getEffectText(skill)}`
          }

          ｜${skill.target ?? "単体"}
          ｜${skill.type ?? "物理"}
          ｜${skill.hits ?? 1}hit
          ｜SP:${skill.cost?.sp ?? 0} / MP:${skill.cost?.mp ?? 0}

          ${skill.isCustom?`<button onclick="renameSkill('${skill.id}')">✏</button>`:""}`
          : "未設定"}
        </div>
      </div>`;
  }
}

function renderSkillList(){
  const div=document.getElementById("skillList");
  const word=(document.getElementById("skillSearch").value || "").trim();

  div.innerHTML="";

  getAllSkills()
    .filter(s=>{
      if(!word) return true; // ←これ重要
      return getSkillName(s).includes(word);
    })
    .forEach((s,index)=>{
      div.innerHTML+=`
        <div class="skill-item">
          No.${index+1}｜${getSkillName(s)}｜威力:${s.power ?? 1}
          ${s.isCustom?`<button onclick="renameSkill('${s.id}')">✏</button>`:"🔒"}
        </div>`;
    });
}

function save(){
  localStorage.setItem("playerData",JSON.stringify(player));
}

function render(){
  renderStats();
  renderTotal();
  renderSkills();
  renderSkillList();
}

</script>
<script src="../system/skills.js?v=4"></script>
<script>
localStorage.clear()
window.onload = function(){
  render();
};
</script>
</body>
</html>
