<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>

/* 背景 */
body {
  background: radial-gradient(circle at center, #0a0f2c, #000);
  color: #e0e6ff;
  font-family: "Consolas", monospace;
}

/* レイアウト */
.main {
  display: flex;
  gap: 30px;
  padding: 20px;
}

/* 左（立ち絵） */
.left {
  width: 300px;
}

.portrait {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(100,150,255,0.4);
  transition: 0.2s;
}

.portrait:hover {
  transform: scale(1.02);
}

/* 右 */
.right {
  flex: 1;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(100,150,255,0.2);
}

/* タイトル */
.title {
  color: #8ae1ff;
  margin-bottom: 10px;
}

/* ステータス */
.stats {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.stat {
  background: rgba(0,0,0,0.3);
  padding: 10px;
  border-radius: 8px;
  border: 1px solid rgba(100,150,255,0.2);
}

/* スキル */
.skills {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

select {
  background: #111;
  border: 1px solid #3aa;
  color: #8ae1ff;
  padding: 8px;
  border-radius: 6px;
}

button {
  margin-top: 15px;
}

</style>
</head>

<body>

<div class="main">

  <!-- 左：立ち絵 -->
  <div class="left">
    <img id="portrait" class="portrait">
  </div>

  <!-- 右 -->
  <div class="right">

    <h2 class="title">ステータス</h2>
    <div id="stats" class="stats"></div>

    <h2 class="title mt-6">スキル設定</h2>
    <div id="skills" class="skills"></div>

    <button onclick="save()" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500">
      💾 保存
    </button>

  </div>

</div>

<script>

// =====================
// 初期データ（なければ作る）
// =====================
let player = JSON.parse(localStorage.getItem("playerData"));

if(!player){
  player = {
    base:{ physical:10, magic:8, vitality:12, endurance:10, agility:7, spirit:9, luck:5 },
    bonus:{ physical:0, magic:0, vitality:0, endurance:0, agility:0, spirit:0, luck:0 },
    skillsOwned:[
      {id:"s1", name:"星裂斬"},
      {id:"s2", name:"蒼流波"},
      {id:"s3", name:"月影突"}
    ],
    skillsEquipped:[],
    portrait:"https://via.placeholder.com/300x400"
  };
}

// =====================
// スキル枠計算
// =====================
function getSlots(){
  const total = Object.values(player.base).reduce((a,b)=>a+b,0);

  if(total >= 100) return 16;
  if(total >= 80) return 14;
  if(total >= 60) return 12;

  return 10;
}

// =====================
// UI描画
// =====================
function render(){

  // 立ち絵
  document.getElementById("portrait").src = player.portrait;

  // ステータス
  const statsDiv = document.getElementById("stats");
  statsDiv.innerHTML = "";

  for(let key in player.base){
    const div = document.createElement("div");
    div.className = "stat";
    div.innerHTML = `
      <strong>${key}</strong><br>
      ${player.base[key]} + ${player.bonus[key]}
    `;
    statsDiv.appendChild(div);
  }

  // スキル
  const skillDiv = document.getElementById("skills");
  skillDiv.innerHTML = "";

  const slots = getSlots();

  for(let i=0;i<slots;i++){

    const select = document.createElement("select");

    const empty = document.createElement("option");
    empty.value="";
    empty.textContent="未設定";
    select.appendChild(empty);

    player.skillsOwned.forEach(s=>{
      const opt = document.createElement("option");
      opt.value=s.id;
      opt.textContent=s.name;
      select.appendChild(opt);
    });

    if(player.skillsEquipped[i]){
      select.value = player.skillsEquipped[i];
    }

    select.onchange = (e)=>{
      player.skillsEquipped[i] = e.target.value;
    };

    skillDiv.appendChild(select);
  }
}

// =====================
// 保存
// =====================
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
  alert("保存した！");
}

// 初回描画
render();

</script>

</body>
</html>
