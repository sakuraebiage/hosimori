<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}

header{
  background:#111;
  padding:10px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}
nav a{
  margin:0 6px;
  color:#8ae1ff;
  text-decoration:none;
}

.box{
  border:1px solid #00eaff;
  padding:6px;
  margin:4px;
}

.top{
  display:flex;
  gap:20px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.stat-input{
  width:60px;
}

.total-flex{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.total-item{
  width:140px;
  border:1px solid #00eaff;
  padding:6px;
}

.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}

select{
  width:150px;
  font-size:12px;
}

.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}

.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div>
    <div id="totalStats" class="box"></div>
    <img id="portrait" style="width:150px;margin-top:10px;border:1px solid #00eaff;">
  </div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  base:{physical:5,magic:5,vitality:5,endurance:5,agility:5,spirit:5,luck:5},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  skillsEquipped:[],
  equipment:{}
};

// ===== ステ計算 =====
function getTotalStats(){
  const t={...player.base};
  for(let k in player.trainingBonus){
    t[k]+=player.trainingBonus[k];
  }
  return t;
}

// ===== 入力 =====
function setStat(k,val){
  player.base[k]=Number(val)||0;
  save(); render();
}

// ===== ステ表示 =====
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>

        <input class="stat-input"
          value="${player.base[k]}"
          onchange="setStat('${k}',this.value)">

        → ${t[k]}<br>

        <button onclick="player.base['${k}']++;render();save()">＋</button>
        <button onclick="player.base['${k}']--;render();save()">－</button>
        <button onclick="train('${k}')">訓練</button>

      </div>
    `;
  }
}

// ===== 総合 =====
function renderTotal(){

  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    <div class="total-flex">

      <div class="total-item">HP ${t.vitality*10}</div>
      <div class="total-item">SP ${t.physical*2}</div>
      <div class="total-item">MP ${t.spirit*5}</div>

      <div class="total-item">物理 ${t.physical*2}</div>
      <div class="total-item">魔法 ${t.magic*2}</div>

      <div class="total-item">防御 ${t.endurance*2}</div>
      <div class="total-item">速度 ${(t.agility*1.5).toFixed(1)}</div>

      <div class="total-item">幸運 ${t.luck}</div>

    </div>
  `;
}

// ===== 立ち絵 =====
function renderPortrait(){
  const img = localStorage.getItem("profileImage");
  if(img){
    document.getElementById("portrait").src = img;
  }
}

// ===== スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",cost:{sp:5,mp:0},target:"敵単体",type:"物理"},
  {id:"s2",name:"蒼流波",cost:{sp:0,mp:8},target:"敵全体",type:"魔法"}
];

function getAllSkills(){
  return skillMaster;
}

function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const current=player.skillsEquipped[i];
    const skill=getAllSkills().find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;

    getAllSkills().forEach(s=>{
      options+=`<option value="${s.id}">${s.name}</option>`;
    });

    div.innerHTML+=`
      <div class="skill-row">
        <select onchange="setSkill(${i},this.value)">
          ${options}
        </select>

        <div class="box" style="flex:1;">
          ${
            skill
            ? `${skill.name}｜SP:${skill.cost.sp} MP:${skill.cost.mp}｜${skill.target}`
            : "未設定"
          }
        </div>
      </div>
    `;
  }
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save(); render();
}

// ===== 一覧 =====
function renderSkillList(){
  const div=document.getElementById("skillList");
  div.innerHTML="";

  getAllSkills().forEach(s=>{
    div.innerHTML+=`
      <div class="skill-item">
        ${s.name}｜SP:${s.cost.sp} MP:${s.cost.mp}
      </div>
    `;
  });
}

// ===== 訓練 =====
function train(k){
  player.trainingBonus[k]++;
  save(); render();
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderSkills();
  renderSkillList();
  renderPortrait();
}

render();

</script>

</body>
</html>
