<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body {
  background:#0a0f2c;
  color:#e0e6ff;
  font-family:monospace;
}
.box {
  background:#111;
  padding:10px;
  margin:8px;
  border-radius:6px;
}
.small {
  font-size:12px;
  color:#9fd;
}
</style>
</head>

<body>

<h1>⚔ 戦闘設定</h1>

<h2>ステータス</h2>
<div id="stats"></div>

<h2>スキル設定</h2>
<div id="skills"></div>

<h2>所持スキル</h2>
<div id="skillList"></div>

<h2>装備</h2>
<div id="equipment"></div>

<script>

// =====================
// スキル
// =====================
const skillMaster = [
  {id:"s1", name:"星裂斬", power:1.2, target:"単体", cost:{sp:5,mp:0}, desc:"物理攻撃"},
  {id:"s2", name:"蒼流波", power:1.0, target:"全体", cost:{sp:0,mp:8}, desc:"魔法攻撃"},
  {id:"s3", name:"月影突", power:0.9, target:"単体", cost:{sp:3,mp:2}, desc:"高会心"}
];

// =====================
// 装備
// =====================
const equipmentMaster = [
  {id:"w1", name:"鉄の剣", type:"weapon", bonus:{ physical:5 }},
  {id:"w2", name:"魔導杖", type:"weapon", bonus:{ magic:5 }},
  {id:"a1", name:"革の鎧", type:"armor", bonus:{ endurance:5 }},
  {id:"a2", name:"ローブ", type:"armor", bonus:{ spirit:5 }},
  {id:"r1", name:"幸運の指輪", type:"accessory", bonus:{ luck:5 }},
  {id:"r2", name:"疾風の靴", type:"accessory", bonus:{ agility:5 }}
];

// =====================
// プレイヤー
// =====================
let player = JSON.parse(localStorage.getItem("playerData"));

if(!player){
  player = {
    base:{ physical:5, magic:5, vitality:5, endurance:5, agility:5, spirit:5, luck:5 },
    points:10,
    skillsOwned:[],
    skillsEquipped:[],
    equipment:{ weapon:null, armor:null, accessory:null }
  };
  save();
}

// =====================
// 装備込みステ
// =====================
function getTotalStats(){

  const total = {...player.base};

  Object.values(player.equipment).forEach(id=>{
    const eq = equipmentMaster.find(e=>e.id===id);
    if(!eq) return;

    for(let k in eq.bonus){
      total[k] = (total[k]||0) + eq.bonus[k];
    }
  });

  return total;
}

// =====================
// 戦闘ステータス
// =====================
function getBattleStats(){

  const t = getTotalStats();

  return {
    atk: t.physical * 2,
    matk: t.magic * 2,
    hp: t.vitality * 10,
    def: t.endurance * 2,
    spd: t.agility * 1.5,
    mp: t.spirit * 5,
    luck: t.luck
  };
}

// =====================
// 装備スキル取得
// =====================
function getEquippedSkills(){
  return player.skillsEquipped
    .map(id => skillMaster.find(s=>s.id===id))
    .filter(s => s);
}

// =====================
// ステ表示
// =====================
function renderStats(){

  const total = getTotalStats();
  const div = document.getElementById("stats");

  div.innerHTML = `<div>残りポイント: ${player.points}</div>`;

  for(let k in player.base){
    div.innerHTML += `
      <div class="box">
        ${k}: ${player.base[k]} (+${total[k]-player.base[k]})
        <br>
        <button onclick="addStat('${k}')">＋</button>
      </div>
    `;
  }
}

function addStat(k){
  if(player.points<=0) return;
  player.base[k]++;
  player.points--;
  save();
  render();
}

// =====================
// スキル設定
// =====================
function renderSkills(){

  const div = document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const current = player.skillsEquipped[i];

    let options = `<option value="">未設定</option>`;

    player.skillsOwned.forEach(s=>{
      options += `<option value="${s.id}" ${current===s.id?"selected":""}>${s.name}</option>`;
    });

    const skill = skillMaster.find(s=>s.id===current);

    div.innerHTML += `
      <div class="box">
        スロット${i+1}<br>

        <select onchange="selectSkill(${i}, this.value)">
          ${options}
        </select>

        <div class="small">
          ${skill ? `
            ${skill.desc}<br>
            威力: ${skill.power}倍<br>
            対象: ${skill.target}<br>
            SP:${skill.cost.sp} / MP:${skill.cost.mp}
          ` : "未設定"}
        </div>
      </div>
    `;
  }
}

function selectSkill(i,id){
  player.skillsEquipped[i]=id;
  save();
  render();
}

// =====================
// スキル一覧
// =====================
function renderSkillList(){

  const div = document.getElementById("skillList");
  div.innerHTML="";

  if(player.skillsOwned.length===0){
    div.innerHTML="スキルなし";
    return;
  }

  player.skillsOwned.forEach(s=>{

    const m = skillMaster.find(x=>x.id===s.id);

    div.innerHTML += `
      <div class="box">
        <strong>${s.name}</strong><br>
        ${m.desc}<br>
        威力: ${m.power}倍<br>
        SP:${m.cost.sp} / MP:${m.cost.mp}
      </div>
    `;
  });
}

// =====================
// スキル取得（テスト）
// =====================
function learnSkill(id){

  const skill = skillMaster.find(s=>s.id===id);
  if(!skill) return;

  if(player.skillsOwned.some(s=>s.id===id)) return;

  player.skillsOwned.push(skill);
  save();
  render();
}

// =====================
// 装備
// =====================
function renderEquipment(){

  const div = document.getElementById("equipment");
  div.innerHTML="";

  ["weapon","armor","accessory"].forEach(type=>{

    let options = `<option value="">なし</option>`;

    equipmentMaster
      .filter(e=>e.type===type)
      .forEach(e=>{
        options += `<option value="${e.id}" ${player.equipment[type]===e.id?"selected":""}>${e.name}</option>`;
      });

    div.innerHTML += `
      <div class="box">
        ${type}<br>
        <select onchange="equip('${type}', this.value)">
          ${options}
        </select>
      </div>
    `;
  });
}

function equip(type,id){
  player.equipment[type]=id;
  save();
  render();
}

// =====================
// デバッグ（超重要）
// =====================
function debugBattle(){

  console.log("=== 戦闘データ ===");
  console.log("戦闘ステ:", getBattleStats());
  console.log("装備スキル:", getEquippedSkills());
}

// =====================
// 保存
// =====================
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// =====================
// 初期描画
// =====================
function render(){
  renderStats();
  renderSkills();
  renderSkillList();
  renderEquipment();
  debugBattle(); // ←ここ重要
}

render();

</script>

</body>
</html>
