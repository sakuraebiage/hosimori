<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<style>
body{
  background: radial-gradient(circle at top,#0a0f2c,#020611);
  color:#00eaff;
  font-family:Consolas;
  padding:20px;
}

header{
  background:#111;
  padding:10px;
  text-align:center;
  border-bottom:1px solid #00eaff;
}
nav a{
  margin:0 6px;
  color:#8ae1ff;
  text-decoration:none;
}

.box{
  border:1px solid #00eaff;
  padding:6px;
  margin:4px;
}

.top{
  display:flex;
  gap:20px;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.skill-row{
  display:flex;
  gap:6px;
  margin-bottom:4px;
}

select{
  width:150px;
  font-size:12px;
}

.skill-list{
  max-height:250px;
  overflow-y:auto;
  border:1px solid #00eaff;
}

.skill-item{
  padding:6px;
  border-bottom:1px solid #00eaff;
}

.skill-item:hover{
  background:rgba(0,255,255,0.1);
}
</style>
</head>

<body>

<header>
<h1>星守戦線</h1>
<nav>
<a href="/hosimori/index.html">🏠</a>
<a href="/hosimori/defense/defense.html">🛡</a>
<a href="/hosimori/setting/dev_stats_editor.html">⚔</a>
</nav>
</header>

<h2>ステータス</h2>

<div class="top">
  <div id="stats" class="stats-grid"></div>
  <div id="totalStats" class="box"></div>
</div>

<h2>装備</h2>
<div id="equipment"></div>

<h2>スキルスロット</h2>
<div id="skills"></div>

<h2>スキル一覧</h2>
<input id="skillSearch" placeholder="検索" oninput="renderSkillList()">
<div id="skillList" class="skill-list"></div>

<script>

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData")) || {
  level:1,
  base:{physical:5,magic:5,vitality:5,endurance:5,agility:5,spirit:5,luck:5},
  trainingBonus:{physical:0,magic:0,vitality:0,endurance:0,agility:0,spirit:0,luck:0},
  points:45,
  skillsEquipped:[],
  equipment:{}
};

// ===== スキル保存 =====
function getPlayerSkills(){
  return JSON.parse(localStorage.getItem("playerSkills")) || [];
}
function savePlayerSkills(list){
  localStorage.setItem("playerSkills", JSON.stringify(list));
}

// ===== スキル =====
const skillMaster = [
  {id:"s1",name:"星裂斬",power:1.2,cost:{sp:5,mp:0},target:"敵単体",type:"物理"},
  {id:"s2",name:"蒼流波",power:1.0,cost:{sp:0,mp:8},target:"敵全体",type:"魔法"},
  {id:"s3",name:"月影突",power:0.9,cost:{sp:3,mp:2},target:"敵単体",type:"物理"}
];

// ===== 装備 =====
const equipmentMaster = [
  {id:"w1",name:"鉄の剣",type:"weapon",bonus:{physical:5}},
  {id:"a1",name:"革の鎧",type:"armor",bonus:{endurance:5}}
];

// ===== スキル生成 =====
function generateSkill(){
  const t = getTotalStats();
  const main = t.physical > t.magic ? "物理" : "魔法";

  return {
    id:"p_"+Date.now(),
    name: main==="物理" ? "強撃" : "魔弾",
    power:Number((1 + Math.max(t.physical,t.magic)*0.02).toFixed(2)),
    cost:{
      sp: main==="物理"?8:0,
      mp: main==="魔法"?8:0
    },
    target:"敵単体",
    type:main
  };
}

// ===== ステ =====
function getTotalStats(){
  const t={...player.base};

  for(let k in player.trainingBonus){
    t[k]+=player.trainingBonus[k];
  }

  Object.values(player.equipment).forEach(id=>{
    const eq=equipmentMaster.find(e=>e.id===id);
    if(eq){
      for(let k in eq.bonus){
        t[k]+=eq.bonus[k];
      }
    }
  });

  return t;
}

// ===== 訓練 =====
function train(k){
  player.trainingBonus[k]++;

  if(Math.random()<0.25){
    const list=getPlayerSkills();
    list.push(generateSkill());
    savePlayerSkills(list);
    alert("新スキル習得！");
  }

  save();
  render();
}

// ===== ステ表示 =====
function renderStats(){
  const t=getTotalStats();
  const div=document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){
    div.innerHTML+=`
      <div class="box">
        ${k}<br>
        ${player.base[k]} → ${t[k]}<br>
        <button onclick="train('${k}')">訓練</button>
      </div>
    `;
  }
}

// ===== 総合 =====
function renderTotal(){
  const t=getTotalStats();

  document.getElementById("totalStats").innerHTML=`
    HP:${t.vitality*10}<br>
    SP:${t.physical*2}<br>
    MP:${t.spirit*5}<br><br>

    物理攻撃:${t.physical*2}<br>
    魔法攻撃:${t.magic*2}<br><br>

    防御:${t.endurance*2}<br>
    速度:${(t.agility*1.5).toFixed(1)}<br><br>

    幸運:${t.luck}
  `;
}

// ===== 装備 =====
function renderEquipment(){
  const div=document.getElementById("equipment");
  div.innerHTML="";

  ["weapon","armor"].forEach(type=>{

    let options="<option value=''>なし</option>";

    equipmentMaster
      .filter(e=>e.type===type)
      .forEach(e=>{
        options+=`<option value="${e.id}">${e.name}</option>`;
      });

    div.innerHTML+=`
      <div class="box">
        ${type}<br>
        <select onchange="equip('${type}',this.value)">
          ${options}
        </select>
      </div>
    `;
  });
}

function equip(type,id){
  player.equipment[type]=id;
  save();
  render();
}

// ===== スキル =====
function getAllSkills(){
  return [...skillMaster, ...getPlayerSkills()];
}

function renderSkills(){
  const div=document.getElementById("skills");
  div.innerHTML="";

  for(let i=0;i<5;i++){

    const current=player.skillsEquipped[i];
    const skill=getAllSkills().find(s=>s.id===current);

    let options=`<option value="">未設定</option>`;

    getAllSkills().forEach(s=>{
      options+=`
        <option value="${s.id}" ${current===s.id?"selected":""}>
          ${s.name}
        </option>
      `;
    });

    div.innerHTML+=`
      <div class="skill-row">

        <select onchange="setSkill(${i},this.value)">
          ${options}
        </select>

        <div class="box" style="flex:1;font-size:12px;">
          ${
            skill
            ? `${skill.name} ｜ SP:${skill.cost.sp} MP:${skill.cost.mp} ｜ ${skill.target} ｜ ${skill.type}`
            : "未設定"
          }
        </div>

      </div>
    `;
  }
}

function setSkill(i,id){
  player.skillsEquipped[i]=id;
  save();
  render();
}

// ===== スキル一覧 =====
function renderSkillList(){
  const word=document.getElementById("skillSearch").value||"";
  const div=document.getElementById("skillList");

  div.innerHTML="";

  getAllSkills()
    .filter(s=>s.name.includes(word))
    .forEach(s=>{
      div.innerHTML+=`
        <div class="skill-item">
          <strong>${s.name}</strong>
          ｜SP:${s.cost.sp} MP:${s.cost.mp}
          ｜${s.target}
          ｜${s.type}
        </div>
      `;
    });
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期 =====
function render(){
  renderStats();
  renderTotal();
  renderEquipment();
  renderSkills();
  renderSkillList();
}

render();

</script>

</body>
</html>
