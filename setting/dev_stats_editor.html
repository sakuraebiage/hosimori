<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘設定</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>
body {
  background: radial-gradient(circle at center, #0a0f2c, #000);
  color: #e0e6ff;
  font-family: "Consolas", monospace;
}
.main { display:flex; gap:20px; padding:20px; }
.left { width:260px; }
.portrait {
  width:100%;
  border-radius:12px;
  box-shadow:0 0 20px rgba(100,150,255,0.5);
}
.right {
  flex:1;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  padding:20px;
}
.stat { background:#111; padding:6px; margin:4px; border-radius:6px; }
.skill-box { background:#111; padding:6px; margin:4px; border-radius:6px; }
</style>
</head>

<body>

<div class="main">

<div class="left">
  <img id="portrait" class="portrait">
</div>

<div class="right">

<h2>ステータス（残りポイント: <span id="point"></span>）</h2>
<div id="stats"></div>

<h2>スキル設定</h2>
<div id="skills"></div>

<h2>所持スキル</h2>
<div id="skillList"></div>

<button onclick="save()">保存</button>

</div>
</div>

<script>

// ===== スキルマスター =====
const skillMaster = [
  {id:"s1", name:"星裂斬"},
  {id:"s2", name:"蒼流波"},
  {id:"s3", name:"月影突"}
];

// ===== プレイヤー =====
let player = JSON.parse(localStorage.getItem("playerData"));

if(!player){
  player = {
    base:{ physical:5, magic:5, vitality:5, endurance:5, agility:5, spirit:5, luck:5 },
    points:20,
    skillsOwned:[],
    skillsEquipped:[]
  };
  save();
}

// ===== スロット計算 =====
function getSlots(){
  const total = Object.values(player.base).reduce((a,b)=>a+b,0);

  if(total>=100) return 16;
  if(total>=80) return 12;
  if(total>=60) return 8;

  return 5;
}

// ===== ステータスUI =====
function renderStats(){
  document.getElementById("point").textContent = player.points;

  const div = document.getElementById("stats");
  div.innerHTML="";

  for(let k in player.base){

    const wrap = document.createElement("div");
    wrap.className="stat";

    wrap.innerHTML = `
      ${k}: ${player.base[k]}
      <button onclick="addStat('${k}')">+</button>
    `;

    div.appendChild(wrap);
  }
}

// ===== ステ振り =====
function addStat(key){
  if(player.points<=0) return;

  player.base[key]++;
  player.points--;

  save();
  render();
}

// ===== スキルUI =====
function renderSkills(){
  const div = document.getElementById("skills");
  div.innerHTML="";

  const slots = getSlots();

  for(let i=0;i<slots;i++){

    const wrap = document.createElement("div");
    wrap.className="stat";

    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">未設定</option>`;

    player.skillsOwned.forEach(s=>{
      sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
    });

    sel.value = player.skillsEquipped[i] || "";

    sel.onchange=(e)=>{
      player.skillsEquipped[i]=e.target.value;
      save();
    };

    wrap.innerHTML = `スロット${i+1}`;
    wrap.appendChild(sel);

    div.appendChild(wrap);
  }
}

// ===== スキル一覧 =====
function renderSkillList(){
  const div = document.getElementById("skillList");
  div.innerHTML="";

  if(player.skillsOwned.length===0){
    div.innerHTML="スキルなし";
    return;
  }

  player.skillsOwned.forEach(s=>{
    div.innerHTML += `<div class="skill-box">${s.name}</div>`;
  });
}

// ===== スキル取得 =====
function learnSkill(id){
  const skill = skillMaster.find(s=>s.id===id);
  if(!skill) return;

  if(player.skillsOwned.some(s=>s.id===id)) return;

  player.skillsOwned.push({...skill});
  save();
  render();
}

// ===== 保存 =====
function save(){
  localStorage.setItem("playerData", JSON.stringify(player));
}

// ===== 初期描画 =====
function render(){
  renderStats();
  renderSkills();
  renderSkillList();
}

render();

</script>
  <script src="../system/stats.js"></script>
  <script src="../system/skills.js"></script>
  <script src="../system/battle.js"></script>
  <script src="../data/player.js"></script>

</body>
</html>

</body>
</html>
