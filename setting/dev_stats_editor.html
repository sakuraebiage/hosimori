<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ステータス編集</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

<h1 class="text-2xl font-bold mb-6">🧩 ステータス編集（開発ツール）</h1>

<form class="space-y-4">

  <!-- 名前 -->
  <div>
    <label>キャラクター名</label>
    <input id="charName" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded">
  </div>

  <!-- ステータス -->
  <div class="grid grid-cols-2 gap-4">

    <div><label>体力（vitality）</label><input type="number" id="vit" class="w-full px-3 py-2 bg-gray-800 border"></div>
    <div><label>耐久（endurance）</label><input type="number" id="end" class="w-full px-3 py-2 bg-gray-800 border"></div>

    <div><label>物理（physical）</label><input type="number" id="phy" class="w-full px-3 py-2 bg-gray-800 border"></div>
    <div><label>魔法（magic）</label><input type="number" id="mag" class="w-full px-3 py-2 bg-gray-800 border"></div>

    <div><label>敏捷（agility）</label><input type="number" id="agi" class="w-full px-3 py-2 bg-gray-800 border"></div>
    <div><label>精神（spirit）</label><input type="number" id="spi" class="w-full px-3 py-2 bg-gray-800 border"></div>

    <div><label>幸運（luck）</label><input type="number" id="luk" class="w-full px-3 py-2 bg-gray-800 border"></div>

  </div>

  <!-- スキル -->
  <div>
    <label>スキル（カンマ区切り）</label>
    <textarea id="skills" class="w-full px-3 py-2 bg-gray-800 border"></textarea>
  </div>

  <!-- セリフ -->
  <div>
    <label>戦闘セリフ（改行区切り）</label>
    <textarea id="lines" class="w-full px-3 py-2 bg-gray-800 border"></textarea>
  </div>

  <button type="button" id="saveBtn"
    class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500">
    💾 保存
  </button>

</form>

<hr class="my-6 border-gray-700">

<h2 class="text-xl mb-4">📊 プレビュー</h2>

<div id="preview" class="bg-gray-800 p-4 rounded"></div>

<script>

// =========================
// スキル変換
// =========================
function parseSkills(text) {
  return text.split(",").map(name => ({
    id: "skill_" + Math.random(),
    name: name.trim(),
    customName: "",
    voice: "（セリフ未設定）",
    power: 100,
    type: "physical"
  })).filter(s => s.name !== "");
}

// =========================
// 合計ステータス
// =========================
function getTotalStats(player) {
  const total = {};
  for (let key in player.base) {
    total[key] = player.base[key] + player.bonus[key];
  }
  return total;
}

// =========================
// 派生ステータス
// =========================
function calcDerived(player) {
  const s = getTotalStats(player);

  return {
    HP: s.vitality * 10 + s.endurance * 5,
    MP: s.magic * 5 + s.spirit * 5,
    SP: s.physical * 5 + s.agility * 5,
    回復力: s.endurance * 2 + s.spirit,
    速度: s.agility * 2,
    クリ率: (s.luck * 0.5).toFixed(1) + "%"
  };
}

// =========================
// 表示
// =========================
function render(player) {

  const stats = getTotalStats(player);
  const derived = calcDerived(player);

  let html = `<h3 class="text-lg mb-2">${player.name}</h3>`;

  html += "<div class='grid grid-cols-2 gap-2'>";
  for (let key in stats) {
    html += `
      <div>
        ${key} : ${player.base[key]} + ${player.bonus[key]}
      </div>
    `;
  }
  html += "</div>";

  html += "<hr class='my-3 border-gray-600'>";

  for (let key in derived) {
    html += `<div>${key} : ${derived[key]}</div>`;
  }

  html += "<hr class='my-3 border-gray-600'>";

  html += "<div>スキル:</div>";
  player.skills.forEach(s => {
    html += `<div>・${s.name}「${s.voice}」</div>`;
  });

  document.getElementById("preview").innerHTML = html;
}

// =========================
// 保存
// =========================
document.getElementById("saveBtn").addEventListener("click", () => {

  const player = {
    name: document.getElementById("charName").value,

    base: {
      vitality: Number(vit.value),
      endurance: Number(end.value),
      physical: Number(phy.value),
      magic: Number(mag.value),
      agility: Number(agi.value),
      spirit: Number(spi.value),
      luck: Number(luk.value)
    },

    bonus: {
      vitality: 0,
      endurance: 0,
      physical: 0,
      magic: 0,
      agility: 0,
      spirit: 0,
      luck: 0
    },

    equipment: {
      weapon: null,
      armor: null,
      accessory: null
    },

    skills: parseSkills(skills.value),

    lines: lines.value.split("\n").filter(v => v !== "")
  };

  localStorage.setItem("playerData", JSON.stringify(player));

  render(player);

  alert("保存＆プレビュー更新！");
});

</script>

</body>
</html>
